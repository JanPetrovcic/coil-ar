<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Coil AR — Barcode ID 5 — Marker v1</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#080b11; font-family:system-ui,Arial,sans-serif; }
    #hud {position:fixed;top:12px;left:12px;right:12px;z-index:9999;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.76);color:#fff;font-size:15px;line-height:1.4;text-align:center;pointer-events:none;}
    #help {position:fixed;bottom:18px;left:12px;right:12px;z-index:9999;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.72);color:white;font-size:13px;text-align:center;pointer-events:none;}
    a-scene {width:100vw;height:100vh;}
  </style>
</head>
<body>
  <div id="hud">Marker v1 · Začenjam kamero…</div>
  <div id="help">Barcode 3×3 · ID 5 · 6 × 6 cm<br>Usmeri kamero v celoten marker na zadnji strani tuljave.</div>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; alpha: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  >
    <a-marker id="coilMarker" type="barcode" value="5" size="0.06" emitevents="true" smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
      <!-- The marker lies in AR.js local X/Z plane. Y is its outward normal. -->
      <a-plane rotation="-90 0 0" width="0.06" height="0.06" color="#00ffcc" material="opacity:0.10;transparent:true;side:double"></a-plane>
      <!-- X axis: red, across marker -->
      <a-cylinder position="0.021 0.002 0" radius="0.0016" height="0.042" rotation="0 0 -90" color="#ff3b30"></a-cylinder>
      <a-cone position="0.046 0.002 0" radius-bottom="0.004" radius-top="0" height="0.010" rotation="0 0 -90" color="#ff3b30"></a-cone>
      <!-- Y axis: green, orthogonal to marker surface -->
      <a-cylinder position="0 0.021 0" radius="0.0016" height="0.042" color="#2ddb55"></a-cylinder>
      <a-cone position="0 0.046 0" radius-bottom="0.004" radius-top="0" height="0.010" color="#2ddb55"></a-cone>
      <!-- Z axis: blue, along marker surface -->
      <a-cylinder position="0 0.002 0.021" radius="0.0016" height="0.042" rotation="90 0 0" color="#2792ff"></a-cylinder>
      <a-cone position="0 0.002 0.046" radius-bottom="0.004" radius-top="0" height="0.010" rotation="90 0 0" color="#2792ff"></a-cone>
      <a-sphere position="0 0.003 0" radius="0.004" color="#ffcc33"></a-sphere>
      <a-box position="0 0.012 0" depth="0.012" width="0.012" height="0.012" color="#ffd24a" material="opacity:.75;transparent:true"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    (function(){
      const status = document.getElementById('hud');
      const marker = document.getElementById('coilMarker');
      const scene = document.querySelector('a-scene');
      marker.addEventListener('markerFound', function(){ status.textContent = '✓ Marker ID 5 zaznan — XYZ osi sledijo markerju'; });
      marker.addEventListener('markerLost', function(){ status.textContent = 'Marker izgubljen — pokaži celoten črn rob'; });
      scene.addEventListener('loaded', function(){status.textContent = 'Marker v1 pripravljen — usmeri kamero na ID 5';});
      window.addEventListener('error', function(e){status.textContent = 'Napaka: ' + (e.message || 'neznana');});
    })();
  </script>
</body>
</html>

<title>Coil AR v11 — Magnetic field</title>

<script>
(function () {
  if (!navigator.mediaDevices?.getUserMedia) return;

  const original =
    navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

  const selected = sessionStorage.getItem("coilCameraId");

  if (!selected) return;

  navigator.mediaDevices.getUserMedia = async constraints => {
    if (!constraints?.video) return original(constraints);

    const video = typeof constraints.video === "object"
      ? {...constraints.video} : {};

    delete video.facingMode;
    video.deviceId = {exact:selected};

    try {
      return await original({...constraints,video});
    } catch(e) {
      return original(constraints);
    }
  };
})();
</script>

<script>
/* =====================================================
   FIZIKALNE NASTAVITVE
   ===================================================== */

const MARKER_SIZE_CM = 3.5;
const COIL_RADIUS_CM = 15;

// Začetne točke so zdaj NAD VODNIKOM.
// Oddaljenost začetne točke od vodnika po Y.
const FIELD_SEED_HEIGHTS_CM = [
  1.5, 3, 5, 7, 9
];

// Število segmentov modela tokovne zanke
const WIRE_SEGMENTS = 96;

// Numerična integracija
const STEP_CM = 0.28;
const MAX_STEPS = 550;

// Omejitev radialne razdalje
const MAX_RADIUS_CM = 38;

// Barve
const FIELD_COLOR = 0x35e9ff;
const ARROW_COLOR = 0xffe45e;
const COIL_COLOR = 0xffa64b;

// AR.js merilo
const SCENE_UNITS_PER_CM = 1 / MARKER_SIZE_CM;

const DEFAULTS = {
  x:0,
  y:0,
  z:-20,
  cal:1,
  scale:10,
  planes:8,
  speed:0.15,
  height:24,
  reverse:false,
  showField:true,
  showArrows:true
};

/* =====================================================
   PROGRAM
   ===================================================== */

(() => {
"use strict";

const $ = id => document.getElementById(id);

const scene = document.querySelector("a-scene");
const marker = $("target");
const origin = $("coil-origin");
const axes = $("axes");
const field = $("field-root");

const status = $("status");
const diag = $("diag");

const UP = new THREE.Vector3(0,1,0);

let cfg = {...DEFAULTS};

let ready = false;
let initialized = false;
let found = false;

let wire = [];
let fieldGroup = null;
let movingArrows = [];
let animationTime = 0;
let lastFrame = 0;

// Shrani nastavitve v različico v11
try {
  const saved = JSON.parse(
    localStorage.getItem("coilARv11") ||
    localStorage.getItem("coilARv10") ||
    "null"
  );

  if (saved) {
    for (const k of [
      "x","y","z","cal","scale",
      "planes","speed","height"
    ]) {
      if (
        saved[k] !== undefined &&
        Number.isFinite(Number(saved[k]))
      ) {
        cfg[k] = Number(saved[k]);
      }
    }

    for (const k of [
      "showField","showArrows","reverse"
    ]) {
      if (typeof saved[k] === "boolean") {
        cfg[k] = saved[k];
      }
    }
  }
} catch(e) {}

/* =====================================================
   BIOT–SAVART
   ===================================================== */

function createWire() {
  wire = [];

  for(let i=0;i<WIRE_SEGMENTS;i++) {

    const a = 2*Math.PI*i/WIRE_SEGMENTS;
    const b = 2*Math.PI*(i+1)/WIRE_SEGMENTS;

    const x0 = COIL_RADIUS_CM*Math.cos(a);
    const z0 = COIL_RADIUS_CM*Math.sin(a);

    const x1 = COIL_RADIUS_CM*Math.cos(b);
    const z1 = COIL_RADIUS_CM*Math.sin(b);

    wire.push({
      mx:(x0+x1)/2,
      mz:(z0+z1)/2,
      dx:x1-x0,
      dz:z1-z0
    });
  }
}

function magneticDirection(p) {

  let bx=0,by=0,bz=0;

  for(const s of wire) {

    const rx=p.x-s.mx;
    const ry=p.y;
    const rz=p.z-s.mz;

    const r2=rx*rx+ry*ry+rz*rz+0.04;
    const inv=1/(r2*Math.sqrt(r2));

    bx+=(-s.dz*ry)*inv;
    by+=(s.dz*rx-s.dx*rz)*inv;
    bz+=(s.dx*ry)*inv;
  }

  const len=Math.hypot(bx,by,bz);

  if(len<1e-12 || !Number.isFinite(len))
    return null;

  return new THREE.Vector3(
    bx/len,by/len,bz/len
  );
}

// Runge-Kutta 4. reda
function rk4(p,step) {

  const a=magneticDirection(p);
  if(!a)return null;

  const b=magneticDirection(
    p.clone().addScaledVector(a,step/2)
  );
  if(!b)return null;

  const c=magneticDirection(
    p.clone().addScaledVector(b,step/2)
  );
  if(!c)return null;

  const d=magneticDirection(
    p.clone().addScaledVector(c,step)
  );
  if(!d)return null;

  return p.clone().add(
    a.addScaledVector(b,2)
     .addScaledVector(c,2)
     .add(d)
     .multiplyScalar(step/6)
  );
}

/* =====================================================
   SLEDENJE SILNIC
   ===================================================== */

function trace(seed,sign) {

  const result=[seed.clone()];
  let p=seed.clone();

  for(let i=0;i<MAX_STEPS;i++) {

    const next=rk4(p,sign*STEP_CM);

    if(!next)break;

    const radial=Math.hypot(next.x,next.z);

    const distanceToWire=Math.hypot(
      radial-COIL_RADIUS_CM,
      next.y
    );

    if(distanceToWire<0.45)break;

    if(radial>MAX_RADIUS_CM)break;
    if(next.y>cfg.height)break;

    // Konec pri vodoravni ravnini
    if(next.y<0) {

      if(p.y>=0) {
        const t=p.y/(p.y-next.y);
        result.push(p.clone().lerp(next,t));
      }

      break;
    }

    result.push(next);
    p=next;
  }

  return result;
}

function createBaseLine(height) {

  // Ključna sprememba:
  // začetne točke so okoli vodnika R=15 cm,
  // ne v središču tuljave.
  const seed=new THREE.Vector3(
    COIL_RADIUS_CM,
    height,
    0
  );

  const backward=trace(seed,-1).reverse();
  const forward=trace(seed,1);

  const points=backward.concat(
    forward.slice(1)
  );

  return points.length>=8 ? points : null;
}

function rotatePoint(p,angle) {

  const c=Math.cos(angle);
  const s=Math.sin(angle);

  return new THREE.Vector3(
    p.x*c-p.z*s,
    p.y,
    p.x*s+p.z*c
  );
}

/* =====================================================
   MAGNETNO POLJE — GEOMETRIJA
   ===================================================== */

function removeField() {

  movingArrows=[];

  if(!fieldGroup)return;

  fieldGroup.traverse(obj=>{
    obj.geometry?.dispose();

    if(obj.material) {
      const mats=Array.isArray(obj.material)
        ?obj.material:[obj.material];

      mats.forEach(m=>m.dispose?.());
    }
  });

  field.object3D.remove(fieldGroup);
  fieldGroup=null;
}

function buildField() {

  if(!ready || !field.object3D)return;

  removeField();

  const group=new THREE.Group();
  fieldGroup=group;

  const lineMat=new THREE.LineBasicMaterial({
    color:FIELD_COLOR,
    transparent:true,
    opacity:0.95
  });

  const arrowMat=new THREE.MeshBasicMaterial({
    color:ARROW_COLOR
  });

  // Deljena geometrija vseh puščic
  const arrowGeom=new THREE.ConeGeometry(
    0.45,1.4,6
  );

  const bases=FIELD_SEED_HEIGHTS_CM
    .map(createBaseLine)
    .filter(Boolean);

  for(let a=0;a<cfg.planes;a++) {

    const phi=2*Math.PI*a/cfg.planes;

    for(const base of bases) {

      const pts=base.map(p=>rotatePoint(p,phi));

      const curve=new THREE.CatmullRomCurve3(
        pts,false,"centripetal"
      );

      const samples=curve.getSpacedPoints(
        Math.max(40,Math.min(160,pts.length))
      );

      const geom=new THREE.BufferGeometry()
        .setFromPoints(samples);

      group.add(new THREE.Line(geom,lineMat));

      // Dve puščici na silnico
      for(let k=0;k<2;k++) {

        const arrow=new THREE.Mesh(
          arrowGeom,arrowMat
        );

        group.add(arrow);

        movingArrows.push({
          mesh:arrow,
          curve:curve,
          phase:k/2+(a%4)*0.07
        });
      }
    }
  }

  // Oranžen referenčni obroč R=15 cm
  const ringPts=[];

  for(let i=0;i<120;i++) {
    const a=2*Math.PI*i/120;

    ringPts.push(new THREE.Vector3(
      COIL_RADIUS_CM*Math.cos(a),
      0,
      COIL_RADIUS_CM*Math.sin(a)
    ));
  }

  const ringGeom=new THREE.BufferGeometry()
    .setFromPoints(ringPts);

  group.add(
    new THREE.LineLoop(
      ringGeom,
      new THREE.LineBasicMaterial({
        color:COIL_COLOR,
        transparent:true,
        opacity:0.85
      })
    )
  );

  field.object3D.add(group);

  applyFieldScale();
}

function applyFieldScale() {

  const factor=SCENE_UNITS_PER_CM*cfg.cal;

  field.object3D.scale.setScalar(factor);
  field.object3D.visible=cfg.showField;
}

/* =====================================================
   ANIMACIJA
   ===================================================== */

function animate(time) {

  requestAnimationFrame(animate);

  const dt=lastFrame
    ?Math.min((time-lastFrame)/1000,0.06)
    :0;

  lastFrame=time;

  if(!found || !cfg.showField || !cfg.showArrows) {

    for(const item of movingArrows)
      item.mesh.visible=false;

    return;
  }

  const sign=cfg.reverse?-1:1;

  animationTime+=dt*cfg.speed*sign;

  for(const item of movingArrows) {

    const u=(
      (animationTime+item.phase)%1+1
    )%1;

    const pos=item.curve.getPointAt(u);

    const tangent=item.curve
      .getTangentAt(u)
      .normalize();

    if(sign<0)tangent.negate();

    item.mesh.position.copy(pos);

    item.mesh.quaternion.setFromUnitVectors(
      UP,tangent
    );

    item.mesh.visible=true;
  }
}

requestAnimationFrame(animate);

/* =====================================================
   NASTAVITVE
   ===================================================== */

function apply() {

  cfg.cal=Math.max(0.5,Math.min(2,cfg.cal));
  cfg.scale=Math.max(10,Math.min(30,cfg.scale));

  cfg.planes=Math.max(
    4,Math.min(16,Math.round(cfg.planes/2)*2)
  );

  const k=SCENE_UNITS_PER_CM*cfg.cal;

  const px=cfg.x*k;
  const py=cfg.y*k;
  const pz=cfg.z*k;

  origin.object3D.position.set(px,py,pz);
  axes.object3D.scale.setScalar(cfg.scale);

  applyFieldScale();

  for(const key of [
    "x","y","z","cal","scale",
    "planes","speed","height"
  ]) {
    $(key).value=cfg[key];
  }

  $("showField").checked=cfg.showField;
  $("showArrows").checked=cfg.showArrows;
  $("reverse").checked=cfg.reverse;

  $("xVal").textContent=cfg.x+" cm";
  $("yVal").textContent=cfg.y+" cm";
  $("zVal").textContent=cfg.z+" cm";
  $("calVal").textContent=cfg.cal.toFixed(2)+"×";
  $("scaleVal").textContent=cfg.scale+"×";
  $("planesVal").textContent=cfg.planes;
  $("speedVal").textContent=cfg.speed.toFixed(3);
  $("heightVal").textContent=cfg.height+" cm";

  $("readout").textContent=
    `Offset (${cfg.x},${cfg.y},${cfg.z}) cm · `+
    `R=${COIL_RADIUS_CM} cm`;

  try {
    localStorage.setItem(
      "coilARv11",
      JSON.stringify(cfg)
    );
  }catch(e){}
}

for(const key of [
  "x","y","z","cal","scale","speed"
]) {

  $(key).addEventListener("input",()=>{
    cfg[key]=Number($(key).value);
    apply();
  });
}

for(const key of ["planes","height"]) {

  $(key).addEventListener("change",()=>{
    cfg[key]=Number($(key).value);
    apply();
    buildField();
  });
}

for(const key of [
  "showField","showArrows","reverse"
]) {

  $(key).addEventListener("change",()=>{
    cfg[key]=$(key).checked;
    apply();
  });
}

$("reset").addEventListener("click",()=>{
  cfg={...DEFAULTS};
  apply();
  buildField();
});

$("toggle").addEventListener("click",()=>{
  $("panel").classList.toggle("open");
});

/* =====================================================
   MARKER
   ===================================================== */

marker.addEventListener("markerFound",()=>{
  found=true;
  status.textContent="✓ Marker ID 5 zaznan";
});

marker.addEventListener("markerLost",()=>{
  found=false;
  status.textContent="Marker izgubljen";
});

function init() {

  if(initialized)return;

  initialized=true;
  ready=true;

  createWire();
  apply();
  buildField();

  status.textContent=
    "Coil AR v11 — usmeri telefon na ID 5";
}

scene.addEventListener("loaded",init);

if(scene.hasLoaded)init();

/* =====================================================
   KAMERE
   ===================================================== */

async function cameras() {

  const select=$("cameraSelect");

  const chosen=
    sessionStorage.getItem("coilCameraId")||"";

  select.replaceChildren(
    new Option("Privzeta zadnja kamera","")
  );

  if(!navigator.mediaDevices?.enumerateDevices)return;

  try {
    const devices=(
      await navigator.mediaDevices.enumerateDevices()
    ).filter(d=>d.kind==="videoinput");

    devices.forEach((d,i)=>{
      select.add(new Option(
        d.label||`Kamera ${i+1}`,
        d.deviceId
      ));
    });

    if([...select.options].some(o=>o.value===chosen))
      select.value=chosen;

  }catch(e){
    console.warn(e);
  }
}

$("refreshCameras").addEventListener(
  "click",cameras
);

$("reloadCamera").addEventListener("click",()=>{

  const id=$("cameraSelect").value;

  if(id)
    sessionStorage.setItem("coilCameraId",id);
  else
    sessionStorage.removeItem("coilCameraId");

  document.querySelectorAll("video").forEach(v=>{
    v.srcObject?.getTracks?.().forEach(t=>t.stop());
  });

  location.reload();
});

/* =====================================================
   PRIKAZ KAMERE — ohranjen način iz v9
   ===================================================== */

function layout() {

  const video=[
    ...document.querySelectorAll("video")
  ].find(v=>v.srcObject)
    ||document.querySelector("video");

  const canvas=scene.querySelector("canvas");

  if(video) {

    video.setAttribute("playsinline","");
    video.muted=true;

    for(const [key,value] of Object.entries({
      position:"fixed",
      top:"0",
      left:"0",
      width:"100vw",
      height:"100dvh",
      objectFit:"cover",
      transform:"none",
      zIndex:"0"
    })) {

      video.style.setProperty(
        key.replace(/[A-Z]/g,c=>"-"+c.toLowerCase()),
        value,
        "important"
      );
    }
  }

  if(scene.renderer) {
    scene.renderer.setClearColor(0x000000,0);
    scene.renderer.setClearAlpha(0);
  }

  if(canvas) {
    canvas.style.setProperty(
      "background",
      "transparent",
      "important"
    );
  }

  const track=video?.srcObject
    ?.getVideoTracks?.()[0];

  diag.textContent=
    `Video ${video?.videoWidth||0}×${video?.videoHeight||0}`+
    ` · ${video?.paused?"premor":"predvaja"}`+
    ` · marker ${found?"DA":"NE"}`+
    ` · ${track?.label||"privzeta kamera"}`;
}

window.addEventListener("resize",layout);

setInterval(layout,900);
setTimeout(cameras,1800);

apply();
layout();

window.addEventListener("error",e=>{
  status.textContent="Napaka: "+e.message;
});

})();
</script>

<script>
// Ohrani izbiro kamere iz prejšnjih različic.
(() => {
  const media = navigator.mediaDevices;
  if (!media?.getUserMedia) return;

  const original = media.getUserMedia.bind(media);
  const chosen = sessionStorage.getItem('coilCameraId');
  if (!chosen) return;

  media.getUserMedia = async constraints => {
    if (!constraints?.video) return original(constraints);

    const video = typeof constraints.video === 'object'
      ? {...constraints.video}
      : {};

    delete video.facingMode;
    video.deviceId = {exact: chosen};

    try {
      return await original({...constraints, video});
    } catch (e) {
      window.cameraFallback = e.name;
      return original(constraints);
    }
  };
})();
</script>

<script>
/* ======================================================
   GLAVNE NASTAVITVE
   ====================================================== */

const MARKER_SIZE_CM = 3.5;
const COIL_RADIUS_CM = 15;

// Debelina oranžnega obroča.
// To je POLMER prereza obroča v cm.
// 0.65 cm pomeni debelino (premer) 1.3 cm.
const COIL_TUBE_RADIUS_CM = 0.65;

// Število premikajočih se puščic toka
const CURRENT_ARROW_COUNT = 6;

// Biot-Savartov izračun
const FIELD_SEED_HEIGHTS_CM = [1.5, 3, 5, 7, 9];

const WIRE_SEGMENTS = 96;
const STEP_CM = 0.28;
const MAX_STEPS = 550;
const MAX_RADIUS_CM = 38;

// Barve
const FIELD_COLOR = 0x35e9ff;
const FIELD_ARROW_COLOR = 0xffe45e;
const COIL_COLOR = 0xff9a29;
const CURRENT_COLOR = 0xfff4a3;

// Pretvorba cm v scenske enote AR.js
const SCENE_UNITS_PER_CM = 1 / MARKER_SIZE_CM;

// Začetne nastavitve
const DEFAULTS = {
  x:0,
  y:0,
  z:-20,

  rx:0,
  ry:0,
  rz:0,

  cal:1,
  scale:10,

  planes:8,
  height:24,
  currentSpeed:0.15,

  reverse:false,

  showAxes:true,
  showRing:true,
  showField:true,
  showFieldArrows:true,
  animateCurrent:true
};

/* ======================================================
   GLAVNI PROGRAM
   ====================================================== */

(() => {
'use strict';

const $ = id => document.getElementById(id);

const scene = document.querySelector('a-scene');
const marker = $('target');
const origin = $('coil-origin');
const axes = $('axes');
const fieldRoot = $('field-root');
const status = $('status');
const diag = $('diag');

const UP = new THREE.Vector3(0,1,0);

let cfg = {...DEFAULTS};

let ready = false;
let initialized = false;
let found = false;

let wire = [];

let mainGroup = null;
let linesGroup = null;
let ringGroup = null;

let staticArrows = [];
let currentArrows = [];

let currentPhase = 0;
let lastTime = 0;

/* SHRANJENE NASTAVITVE */

try {
  const saved = JSON.parse(
    localStorage.getItem('coilARv13') ||
    localStorage.getItem('coilARv12') ||
    'null'
  );

  if (saved) {
    for (const k of [
      'x','y','z',
      'rx','ry','rz',
      'cal','scale',
      'planes','height','currentSpeed'
    ]) {
      if (
        saved[k] !== undefined &&
        Number.isFinite(Number(saved[k]))
      ) {
        cfg[k] = Number(saved[k]);
      }
    }

    for (const k of [
      'reverse',
      'showAxes',
      'showRing',
      'showField',
      'showFieldArrows',
      'animateCurrent'
    ]) {
      if (typeof saved[k] === 'boolean') {
        cfg[k] = saved[k];
      }
    }
  }

} catch(e) {}

/* ======================================================
   BIOT-SAVART: KROŽNA TOKOVNA ZANKA
   ====================================================== */

function createWire() {
  wire = [];

  for (let i=0; i<WIRE_SEGMENTS; i++) {

    const a = 2*Math.PI*i/WIRE_SEGMENTS;
    const b = 2*Math.PI*(i+1)/WIRE_SEGMENTS;

    const x0 = COIL_RADIUS_CM*Math.cos(a);
    const z0 = COIL_RADIUS_CM*Math.sin(a);

    const x1 = COIL_RADIUS_CM*Math.cos(b);
    const z1 = COIL_RADIUS_CM*Math.sin(b);

    wire.push({
      mx:(x0+x1)/2,
      mz:(z0+z1)/2,
      dx:x1-x0,
      dz:z1-z0
    });
  }
}

function fieldDirection(p) {
  let bx=0, by=0, bz=0;

  for (const s of wire) {

    const rx = p.x-s.mx;
    const ry = p.y;
    const rz = p.z-s.mz;

    // Majhna regularizacija blizu vodnika.
    const r2 = rx*rx+ry*ry+rz*rz+0.04;
    const inv = 1/(r2*Math.sqrt(r2));

    // dl x r
    bx += (-s.dz*ry)*inv;
    by += (s.dz*rx-s.dx*rz)*inv;
    bz += (s.dx*ry)*inv;
  }

  const n = Math.hypot(bx,by,bz);

  if (!Number.isFinite(n) || n<=1e-12) {
    return null;
  }

  return new THREE.Vector3(
    bx/n,
    by/n,
    bz/n
  );
}

// Runge-Kutta 4. reda
function rk4(p,h) {

  const a = fieldDirection(p);
  if (!a) return null;

  const b = fieldDirection(
    p.clone().addScaledVector(a,h/2)
  );
  if (!b) return null;

  const c = fieldDirection(
    p.clone().addScaledVector(b,h/2)
  );
  if (!c) return null;

  const d = fieldDirection(
    p.clone().addScaledVector(c,h)
  );
  if (!d) return null;

  return p.clone().add(
    a.addScaledVector(b,2)
     .addScaledVector(c,2)
     .add(d)
     .multiplyScalar(h/6)
  );
}

/* SLEDENJE SILNIC */

function trace(seed,sign) {

  const out = [seed.clone()];
  let p = seed.clone();

  for (let i=0; i<MAX_STEPS; i++) {

    const q = rk4(p,sign*STEP_CM);
    if (!q) break;

    const radial = Math.hypot(q.x,q.z);

    if (
      Math.hypot(
        radial-COIL_RADIUS_CM,
        q.y
      ) < 0.45
    ) break;

    if (
      radial > MAX_RADIUS_CM ||
      q.y > cfg.height
    ) break;

    // Samo zgornja polovica polja
    if (q.y < 0) {

      if (p.y >= 0) {
        out.push(
          p.clone().lerp(
            q,
            p.y/(p.y-q.y)
          )
        );
      }

      break;
    }

    out.push(q);
    p=q;
  }

  return out;
}

function baseLine(height) {

  const seed = new THREE.Vector3(
    COIL_RADIUS_CM,
    height,
    0
  );

  const back = trace(seed,-1).reverse();
  const forward = trace(seed,1);

  const merged = back.concat(
    forward.slice(1)
  );

  return merged.length >= 8 ? merged : null;
}

function rotateY(p,a) {

  const c = Math.cos(a);
  const s = Math.sin(a);

  return new THREE.Vector3(
    p.x*c-p.z*s,
    p.y,
    p.x*s+p.z*c
  );
}

/* ======================================================
   ODSTRANITEV PREJŠNJEGA POLJA
   ====================================================== */

function disposeField() {

  staticArrows = [];
  currentArrows = [];

  if (!mainGroup) return;

  const gs = new Set();
  const ms = new Set();

  mainGroup.traverse(obj => {

    if (obj.geometry) {
      gs.add(obj.geometry);
    }

    if (obj.material) {

      const mats = Array.isArray(obj.material)
        ? obj.material
        : [obj.material];

      for (const m of mats) {
        ms.add(m);
      }
    }
  });

  fieldRoot.object3D.remove(mainGroup);

  gs.forEach(g => g.dispose());
  ms.forEach(m => m.dispose());

  mainGroup = null;
  linesGroup = null;
  ringGroup = null;
}

/* ======================================================
   STATIČNE PUŠČICE MAGNETNEGA POLJA
   ====================================================== */

function addStaticFieldArrow(
  parent,
  position,
  direction,
  shaftGeom,
  headGeom,
  mat
) {

  const node = new THREE.Group();

  const shaft = new THREE.Mesh(shaftGeom,mat);
  shaft.position.y = -0.36;

  const head = new THREE.Mesh(headGeom,mat);
  head.position.y = 0.38;

  node.add(shaft,head);
  node.position.copy(position);

  parent.add(node);

  staticArrows.push({
    node,
    direction:direction.clone().normalize()
  });
}

/* ======================================================
   USTVARJANJE POLJA IN DEBELEGA OBROČA
   ====================================================== */

function buildField() {

  if (!ready || !fieldRoot.object3D) return;

  disposeField();

  mainGroup = new THREE.Group();
  linesGroup = new THREE.Group();
  ringGroup = new THREE.Group();

  mainGroup.add(linesGroup,ringGroup);

  const matLine = new THREE.LineBasicMaterial({
    color:FIELD_COLOR,
    transparent:true,
    opacity:0.94
  });

  const matFieldArrow = new THREE.MeshBasicMaterial({
    color:FIELD_ARROW_COLOR
  });

  const matCurrentArrow = new THREE.MeshBasicMaterial({
    color:CURRENT_COLOR
  });

  // Geometrije puščic magnetnega polja
  const fieldShaftGeom = new THREE.CylinderGeometry(
    0.13,0.13,0.9,6
  );

  const fieldHeadGeom = new THREE.ConeGeometry(
    0.39,0.9,6
  );

  // Geometrije puščic električnega toka
  const currentShaftGeom = new THREE.CylinderGeometry(
    0.23,0.23,1.25,7
  );

  const currentHeadGeom = new THREE.ConeGeometry(
    0.67,1.25,7
  );

  /* MAGNETNE SILNICE */

  const bases = FIELD_SEED_HEIGHTS_CM
    .map(baseLine)
    .filter(Boolean);

  for (let i=0; i<cfg.planes; i++) {

    const phi = 2*Math.PI*i/cfg.planes;

    for (const base of bases) {

      const pts = base.map(
        p => rotateY(p,phi)
      );

      const curve = new THREE.CatmullRomCurve3(
        pts,false,'centripetal'
      );

      const samples = curve.getSpacedPoints(
        Math.max(
          40,
          Math.min(160,pts.length)
        )
      );

      const geom = new THREE.BufferGeometry()
        .setFromPoints(samples);

      linesGroup.add(
        new THREE.Line(geom,matLine)
      );

      // Puščici na stalnih položajih!
      for (const t of [0.30,0.72]) {

        const pos = curve.getPointAt(t);

        const dir = fieldDirection(pos)
          || curve.getTangentAt(t);

        addStaticFieldArrow(
          linesGroup,
          pos,
          dir,
          fieldShaftGeom,
          fieldHeadGeom,
          matFieldArrow
        );
      }
    }
  }

  /* DEBEL ORANŽNI OBROČ */

  const ringPts = [];

  for (let i=0; i<120; i++) {

    const a = 2*Math.PI*i/120;

    ringPts.push(
      new THREE.Vector3(
        COIL_RADIUS_CM*Math.cos(a),
        0,
        COIL_RADIUS_CM*Math.sin(a)
      )
    );
  }

  const ringCurve = new THREE.CatmullRomCurve3(
    ringPts,true
  );

  const ringGeom = new THREE.TubeGeometry(
    ringCurve,
    160,
    COIL_TUBE_RADIUS_CM,
    10,
    true
  );

  const ringMesh = new THREE.Mesh(
    ringGeom,
    new THREE.MeshBasicMaterial({
      color:COIL_COLOR
    })
  );

  ringGroup.add(ringMesh);

  /* ANIMIRANE PUŠČICE TOKA */

  for (let i=0; i<CURRENT_ARROW_COUNT; i++) {

    const node = new THREE.Group();

    const shaft = new THREE.Mesh(
      currentShaftGeom,
      matCurrentArrow
    );

    shaft.position.y = -0.36;

    const head = new THREE.Mesh(
      currentHeadGeom,
      matCurrentArrow
    );

    head.position.y = 0.45;

    node.add(shaft,head);
    ringGroup.add(node);

    currentArrows.push({
      node,
      phase:i/CURRENT_ARROW_COUNT
    });
  }

  fieldRoot.object3D.add(mainGroup);

  applyVisibility();
  updateCurrentArrowPositions();
}

/* ======================================================
   VIDNOST IN SMERI
   ====================================================== */

function applyVisibility() {

  if (!fieldRoot.object3D) return;

  fieldRoot.object3D.scale.setScalar(
    SCENE_UNITS_PER_CM*cfg.cal
  );

  if (linesGroup) {
    linesGroup.visible=cfg.showField;
  }

  if (ringGroup) {
    ringGroup.visible=cfg.showRing;
  }

  // Statične puščice sledijo smeri B.
  for (const item of staticArrows) {

    item.node.visible =
      cfg.showField &&
      cfg.showFieldArrows;

    const dir = item.direction.clone()
      .multiplyScalar(cfg.reverse ? -1 : 1);

    item.node.quaternion.setFromUnitVectors(
      UP,dir
    );
  }

  // Tokovne puščice so lahko skrite.
  for (const item of currentArrows) {

    item.node.visible =
      cfg.showRing &&
      cfg.animateCurrent;
  }
}

/* ======================================================
   ANIMIRANA SMER TOKA PO OBROČU
   ====================================================== */

function updateCurrentArrowPositions() {

  const sign = cfg.reverse ? -1 : 1;

  for (const item of currentArrows) {

    const a = 2*Math.PI*(
      item.phase+currentPhase
    );

    item.node.position.set(
      COIL_RADIUS_CM*Math.cos(a),
      1.05,
      COIL_RADIUS_CM*Math.sin(a)
    );

    const tangent = new THREE.Vector3(
      -Math.sin(a)*sign,
      0,
      Math.cos(a)*sign
    );

    item.node.quaternion.setFromUnitVectors(
      UP,tangent
    );
  }
}

function animate(time) {

  requestAnimationFrame(animate);

  const dt = lastTime
    ? Math.min((time-lastTime)/1000,0.06)
    : 0;

  lastTime=time;

  // Samo puščice električnega toka se premikajo.
  if (
    ready &&
    cfg.animateCurrent &&
    cfg.showRing &&
    found
  ) {

    currentPhase +=
      dt*cfg.currentSpeed*
      (cfg.reverse ? -1 : 1);

    currentPhase %= 1;

    updateCurrentArrowPositions();
  }
}

requestAnimationFrame(animate);

/* ======================================================
   POSODOBITEV OFFSETOV IN ROTACIJ
   ====================================================== */

function apply() {

  cfg.cal = Math.max(
    0.5,Math.min(2,cfg.cal)
  );

  cfg.scale = Math.max(
    10,Math.min(30,cfg.scale)
  );

  cfg.planes = Math.max(
    4,
    Math.min(
      16,
      Math.round(cfg.planes/2)*2
    )
  );

  cfg.height = Math.max(
    12,Math.min(40,cfg.height)
  );

  cfg.currentSpeed = Math.max(
    0,Math.min(0.6,cfg.currentSpeed)
  );

  const k = SCENE_UNITS_PER_CM*cfg.cal;

  if (origin.object3D) {

    // OFFSET v centimetrih
    origin.object3D.position.set(
      cfg.x*k,
      cfg.y*k,
      cfg.z*k
    );

    // ROTACIJA v stopinjah
    origin.object3D.rotation.set(
      THREE.MathUtils.degToRad(cfg.rx),
      THREE.MathUtils.degToRad(cfg.ry),
      THREE.MathUtils.degToRad(cfg.rz),
      'YXZ'
    );
  }

  if (axes.object3D) {

    axes.object3D.scale.setScalar(
      cfg.scale
    );

    axes.object3D.visible=cfg.showAxes;
  }

  applyVisibility();
  updateCurrentArrowPositions();

  /* Napisi ob kontrolah */

  for (const a of ['rx','ry','rz']) {
    $(a+'Out').textContent=cfg[a]+'°';
  }

  for (const a of ['x','y','z']) {
    $(a+'Val').textContent=cfg[a]+' cm';
  }

  $('calVal').textContent =
    cfg.cal.toFixed(2)+'×';

  $('scaleVal').textContent =
    cfg.scale+'×';

  $('planesVal').textContent =
    cfg.planes;

  $('heightVal').textContent =
    cfg.height+' cm';

  $('currentSpeedVal').textContent =
    cfg.currentSpeed.toFixed(3)+' obhoda/s';

  for (const key of [
    'x','y','z',
    'cal','scale',
    'planes','height','currentSpeed'
  ]) {
    $(key).value=cfg[key];
  }

  for (const key of [
    'showAxes','showRing',
    'showField','showFieldArrows',
    'animateCurrent','reverse'
  ]) {
    $(key).checked=cfg[key];
  }

  $('readout').textContent =
    `OFFSET (${cfg.x}, ${cfg.y}, ${cfg.z}) cm`+
    ` · ROT (${cfg.rx}°, ${cfg.ry}°, ${cfg.rz}°)`+
    ` · R=${COIL_RADIUS_CM} cm`;

  try {
    localStorage.setItem(
      'coilARv13',
      JSON.stringify(cfg)
    );
  } catch(e) {}
}

/* ======================================================
   GUMBI ZA NAKLON
   ====================================================== */

document.querySelectorAll(
  '[data-axis][data-sign]'
).forEach(button => {

  button.addEventListener('click',() => {

    const axis = button.dataset.axis;

    const sign = Number(
      button.dataset.sign
    );

    const step = Number(
      $('angleStep').value
    );

    cfg[axis] = Math.max(
      -180,
      Math.min(
        180,
        cfg[axis]+sign*step
      )
    );

    apply();
  });
});

$('resetRotation').addEventListener(
  'click',() => {

    cfg.rx=0;
    cfg.ry=0;
    cfg.rz=0;

    apply();
  }
);

/* ======================================================
   OSTALE NASTAVITVE
   ====================================================== */

for (const key of [
  'x','y','z',
  'cal','scale','currentSpeed'
]) {

  $(key).addEventListener('input',() => {

    cfg[key]=Number($(key).value);

    apply();
  });
}

for (const key of ['planes','height']) {

  $(key).addEventListener('change',() => {

    cfg[key]=Number($(key).value);

    apply();
    buildField();
  });
}

for (const key of [
  'showAxes','showRing',
  'showField','showFieldArrows',
  'animateCurrent','reverse'
]) {

  $(key).addEventListener('change',() => {

    cfg[key]=$(key).checked;

    apply();
  });
}

$('resetAll').addEventListener(
  'click',() => {

    cfg={...DEFAULTS};

    apply();
    buildField();
  }
);

$('settingsToggle').addEventListener(
  'click',() => {

    const opened =
      $('panel').classList.toggle('open');

    $('settingsToggle').textContent =
      opened ? '✕ Zapri' : '⚙ Nastavitve';
  }
);

/* ======================================================
   ZAZNAVANJE MARKERJA
   ====================================================== */

marker.addEventListener('markerFound',() => {
  found=true;
  status.textContent='✓ Marker ID 5 zaznan';
});

marker.addEventListener('markerLost',() => {
  found=false;
  status.textContent='Marker izgubljen';
});

function init() {

  if (initialized) return;

  initialized=true;
  ready=true;

  createWire();
  apply();
  buildField();

  status.textContent =
    'Coil AR v13 — usmeri telefon na ID 5';
}

scene.addEventListener('loaded',init);

if (scene.hasLoaded) {
  init();
}

/* ======================================================
   IZBIRA KAMERE
   ====================================================== */

async function cameras() {

  const select=$('cameraSelect');

  const chosen =
    sessionStorage.getItem('coilCameraId') || '';

  select.replaceChildren(
    new Option('Privzeta zadnja kamera','')
  );

  if (!navigator.mediaDevices?.enumerateDevices) {
    return;
  }

  try {

    const devices = (
      await navigator.mediaDevices.enumerateDevices()
    ).filter(d => d.kind==='videoinput');

    devices.forEach((d,i) => {

      select.add(
        new Option(
          d.label || `Kamera ${i+1}`,
          d.deviceId
        )
      );
    });

    if (
      [...select.options].some(
        o => o.value===chosen
      )
    ) {
      select.value=chosen;
    }

  } catch(e) {
    console.warn('Seznam kamer:',e);
  }
}

$('refreshCameras').addEventListener(
  'click',cameras
);

$('reloadCamera').addEventListener(
  'click',() => {

    const id=$('cameraSelect').value;

    if (id) {
      sessionStorage.setItem('coilCameraId',id);
    } else {
      sessionStorage.removeItem('coilCameraId');
    }

    document.querySelectorAll('video')
      .forEach(v => {

        v.srcObject?.getTracks?.()
          .forEach(t => t.stop());
      });

    location.reload();
  }
);

/* ======================================================
   CELOZASLONSKI PRIKAZ KAMERE
   ====================================================== */

function layout() {

  const video = [
    ...document.querySelectorAll('video')
  ].find(v => v.srcObject)
    || document.querySelector('video');

  const canvas=scene.querySelector('canvas');

  if (video) {

    video.setAttribute(
      'playsinline',''
    );

    video.muted=true;

    const styles={
      position:'fixed',
      top:'0',
      left:'0',
      width:'100vw',
      height:'100dvh',
      objectFit:'cover',
      transform:'none',
      zIndex:'0'
    };

    for (const [key,value] of Object.entries(styles)) {

      video.style.setProperty(
        key.replace(
          /[A-Z]/g,
          c => '-'+c.toLowerCase()
        ),
        value,
        'important'
      );
    }
  }

  if (scene.renderer) {

    scene.renderer.setClearColor(
      0x000000,0
    );

    scene.renderer.setClearAlpha(0);
  }

  if (canvas) {

    canvas.style.setProperty(
      'background',
      'transparent',
      'important'
    );
  }

  const track =
    video?.srcObject?.getVideoTracks?.()[0];

  diag.textContent =
    `Video ${video?.videoWidth||0}×${video?.videoHeight||0}`+
    ` · ${video?.paused?'premor':'predvaja'}`+
    ` · marker ${found?'DA':'NE'}`+
    ` · ${track?.label||'privzeta kamera'}`;
}

window.addEventListener('resize',layout);

setInterval(layout,900);
setTimeout(cameras,1800);

apply();
layout();

window.addEventListener('error',e => {
  status.textContent =
    'Napaka: '+(e.message||'neznana');
});

window.addEventListener('unhandledrejection',e => {
  status.textContent =
    'Napaka: '+String(e.reason);
});

})();
</script>

<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Coil AR — Marker v3</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
 html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
 /* AR.js starts its webcam. Show its video in the entire viewport. */
 video,video.arjs-video,body>video{position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;max-width:none!important;max-height:none!important;transform:none!important;margin:0!important;display:block!important;opacity:1!important;visibility:visible!important;z-index:0!important}
 a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;background:transparent!important;z-index:1!important}
 a-scene canvas{background:transparent!important}
 .a-enter-vr,.a-enter-ar{display:none!important}
 #hud{position:fixed;z-index:9999;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;pointer-events:none;text-align:center;color:white}
 #status,#diag{padding:10px;border-radius:12px;background:rgba(0,0,0,.78);margin-bottom:7px}
 #diag{font-size:12px;line-height:1.4;overflow-wrap:anywhere;color:#bfe9ff}
 #tip{position:fixed;z-index:9999;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;background:rgba(0,0,0,.75);color:white;border-radius:12px;padding:10px;text-align:center;font:13px Arial;pointer-events:none}
</style>
</head>
<body>
<div id="hud"><div id="status">Marker v3 — zaganjam AR.js …</div><div id="diag">Čakam na kamero …</div></div>
<div id="tip">Barcode 3 × 3 · ID 5 · 6 × 6 cm. Usmeri kamero na zadnjo stran tuljave.</div>
<!-- Static scene: no click handler and no dynamic scene creation. -->
<a-scene embedded vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
 renderer="alpha:true;antialias:true" arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono_and_matrix;matrixCodeType:3x3;">
  <a-marker id="target" type="barcode" value="5" size="0.06" emitevents="true" smooth="true" smooth-count="5">
   <a-box position="0 0.012 0" width="0.012" height="0.024" depth="0.012" color="yellow"></a-box>
   <a-cylinder position="0.028 0.002 0" radius="0.0015" height="0.056" rotation="0 0 -90" color="red"></a-cylinder>
   <a-cylinder position="0 0.028 0" radius="0.0015" height="0.056" color="lime"></a-cylinder>
   <a-cylinder position="0 0.002 0.028" radius="0.0015" height="0.056" rotation="90 0 0" color="dodgerblue"></a-cylinder>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
<script>
(function(){
 const status=document.getElementById('status');
 const diag=document.getElementById('diag');
 const scene=document.querySelector('a-scene');
 const marker=document.getElementById('target');
 let found=false,ready=false;
 marker.addEventListener('markerFound',function(){found=true;status.textContent='✓ Marker ID 5 zaznan — XYZ osi';});
 marker.addEventListener('markerLost',function(){found=false;status.textContent='Marker izgubljen — usmeri na ID 5';});
 scene.addEventListener('loaded',function(){ready=true;status.textContent='Marker v3 — scena pripravljena';});
 window.addEventListener('error',function(e){status.textContent='Napaka: '+(e.message||'neznana');});
 window.addEventListener('unhandledrejection',function(e){status.textContent='Napaka: '+String(e.reason||'neznana');});
 function layout(){
  let v=[...document.querySelectorAll('video')].find(x=>x.srcObject)||document.querySelector('video');
  let canvas=scene.querySelector('canvas');
  if(v){v.setAttribute('playsinline','');v.muted=true;v.style.setProperty('position','fixed','important');v.style.setProperty('top','0','important');v.style.setProperty('left','0','important');v.style.setProperty('width','100vw','important');v.style.setProperty('height','100vh','important');v.style.setProperty('object-fit','cover','important');v.style.setProperty('transform','none','important');v.style.setProperty('z-index','0','important');}
  if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0);}
  if(canvas){canvas.style.setProperty('background','transparent','important');}
  const videoText=v?(v.videoWidth+'×'+v.videoHeight+' / '+(v.paused?'premor':'predvaja')):'ni najden';
  const rect=v&&v.getBoundingClientRect();
  diag.textContent='zaslon '+innerWidth+'×'+innerHeight+' | video '+videoText+' | polje '+(rect?Math.round(rect.width)+'×'+Math.round(rect.height):'—')+' | scena '+(ready?'pripravljena':'nalaga')+' | marker '+(found?'DA':'NE');
  if(ready&&!found&&v&&v.readyState>=2&&status.textContent.indexOf('Napaka')!==0){status.textContent='Kamera aktivna — poišči ID 5';}
 }
 setInterval(layout,700);
 window.addEventListener('resize',layout);
 layout();
})();
</script>
</body></html>


<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coil AR — Marker v9 · magnetno polje</title>

<script>
// Izbira kamere
(function () {
  const media = navigator.mediaDevices;
  if (!media?.getUserMedia) return;

  const original = media.getUserMedia.bind(media);
  const selected = sessionStorage.getItem('coilCameraId');

  media.getUserMedia = async function (constraints) {
    if (!selected || !constraints?.video) {
      return original(constraints);
    }

    const video = typeof constraints.video === 'object'
      ? {...constraints.video} : {};

    delete video.facingMode;
    video.deviceId = {exact:selected};

    try {
      return await original({...constraints, video});
    } catch (e) {
      window._cameraFallback = `${e.name}: ${e.message}`;
      return original(constraints);
    }
  };
})();
</script>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
*,*::before,*::after {
  box-sizing:border-box;
}

html,body {
  margin:0!important;
  padding:0!important;
  width:100%!important;
  height:100%!important;
  overflow:hidden!important;
  background:#111;
  font-family:Arial,sans-serif;
}

body {
  height:100dvh!important;
}

video,video.arjs-video,body>video {
  position:fixed!important;
  top:0!important;
  left:0!important;
  width:100vw!important;
  height:100dvh!important;
  max-width:none!important;
  max-height:none!important;
  object-fit:cover!important;
  transform:none!important;
  display:block!important;
  opacity:1!important;
  visibility:visible!important;
  z-index:0!important;
  margin:0!important;
}

a-scene {
  position:fixed!important;
  inset:0!important;
  width:100vw!important;
  height:100dvh!important;
  background:transparent!important;
  z-index:1!important;
}

a-scene canvas {
  background:transparent!important;
}

.a-enter-vr,.a-enter-ar {
  display:none!important;
}

#hud {
  position:fixed;
  left:max(8px,env(safe-area-inset-left));
  right:max(8px,env(safe-area-inset-right));
  top:calc(8px + env(safe-area-inset-top));
  z-index:9998;
  text-align:center;
  color:white;
  pointer-events:none;
  overflow-wrap:anywhere;
}

#status,#diag {
  background:rgba(0,0,0,.75);
  border-radius:9px;
  padding:6px 8px;
  margin-bottom:4px;
}

#status {
  font-size:13px;
  font-weight:bold;
}

#diag {
  font-size:10px;
  color:#c7efff;
  line-height:1.35;
}

#settings {
  position:fixed;
  right:max(8px,env(safe-area-inset-right));
  bottom:calc(10px + env(safe-area-inset-bottom));
  z-index:10000;
  color:white;
  width:min(360px,calc(100vw - 16px));
  font-size:12px;
}

#toggle {
  display:block;
  margin-left:auto;
  background:#135cbb;
  color:white;
  border:none;
  border-radius:8px;
  padding:11px 15px;
  font-weight:bold;
  font-size:14px;
}

#panel {
  display:none;
  margin-top:6px;
  padding:12px;
  background:rgba(10,15,22,.95);
  border:1px solid #4b6278;
  border-radius:12px;
  max-height:68dvh;
  overflow:auto;
}

#panel.open {
  display:block;
}

#panel label {
  display:block;
  margin-top:9px;
}

#panel select {
  width:100%;
  padding:7px;
  background:#263341;
  color:white;
  border:1px solid #718299;
  border-radius:6px;
  font-size:13px;
}

#panel input[type=range] {
  width:100%;
  accent-color:#4bbcff;
}

#panel button {
  padding:8px 10px;
  background:#334c65;
  color:white;
  border:1px solid #8396a7;
  border-radius:7px;
  margin-top:8px;
}

#panel .muted {
  color:#b5c8d9;
  font-size:11px;
  line-height:1.45;
}

#panel .reading {
  color:#92e6fe;
  font-variant-numeric:tabular-nums;
}

#panel .check {
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:12px;
}

#panel .check input {
  width:18px;
  height:18px;
}
</style>
</head>

<body>

<div id="hud">
  <div id="status">Marker v9 — zaganjam kamero …</div>
  <div id="diag">Čakam na kamero …</div>
</div>

<!-- ===========================
     AR SCENA
     =========================== -->

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="alpha:true;antialias:true"
  arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono_and_matrix;matrixCodeType:3x3;sourceWidth:1280;sourceHeight:960;displayWidth:1280;displayHeight:960;canvasWidth:960;canvasHeight:720;maxDetectionRate:30;">

  <a-marker
    id="target"
    type="barcode"
    value="5"
    size="0.035"
    emitevents="true"
    smooth="true"
    smooth-count="5"
    smooth-tolerance="0.01"
    smooth-threshold="2">

    <!-- Skupno izhodišče:
         offset premakne osi in polje hkrati. -->

    <a-entity id="coil-origin">

      <!-- XYZ KOORDINATNI SISTEM -->

      <a-entity id="axes">

        <a-sphere
          radius="0.008"
          color="white"
          material="shader:flat">
        </a-sphere>

        <!-- X: rdeča -->
        <a-cylinder
          position="0.05 0 0"
          radius="0.0027"
          height="0.10"
          rotation="0 0 -90"
          color="#ff3030"
          material="shader:flat">
        </a-cylinder>

        <a-cone
          position="0.107 0 0"
          radius-bottom="0.008"
          radius-top="0"
          height="0.015"
          rotation="0 0 -90"
          color="#ff3030"
          material="shader:flat">
        </a-cone>

        <a-text
          value="X"
          position="0.124 0.009 0"
          color="#ff3030"
          width="0.09"
          align="center"
          side="double">
        </a-text>

        <!-- Y: zelena -->
        <a-cylinder
          position="0 0.05 0"
          radius="0.0027"
          height="0.10"
          color="#2bff60"
          material="shader:flat">
        </a-cylinder>

        <a-cone
          position="0 0.107 0"
          radius-bottom="0.008"
          radius-top="0"
          height="0.015"
          color="#2bff60"
          material="shader:flat">
        </a-cone>

        <a-text
          value="Y"
          position="0.012 0.129 0"
          color="#2bff60"
          width="0.09"
          align="center"
          side="double">
        </a-text>

        <!-- Z: modra -->
        <a-cylinder
          position="0 0 0.05"
          radius="0.0027"
          height="0.10"
          rotation="90 0 0"
          color="#2b9cff"
          material="shader:flat">
        </a-cylinder>

        <a-cone
          position="0 0 0.107"
          radius-bottom="0.008"
          radius-top="0"
          height="0.015"
          rotation="90 0 0"
          color="#2b9cff"
          material="shader:flat">
        </a-cone>

        <a-text
          value="Z"
          position="0.012 0.006 0.132"
          rotation="-90 0 0"
          color="#2b9cff"
          width="0.09"
          align="center"
          side="double">
        </a-text>

      </a-entity>

      <!-- MAGNETNO POLJE -->
      <a-entity id="field-root"></a-entity>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- ===========================
     NASTAVITVE
     =========================== -->

<div id="settings">

  <button id="toggle" type="button">
    ⚙ Nastavitve
  </button>

  <div id="panel">

    <strong>Coil AR v9 · Barcode ID 5 · 35 mm</strong>

    <p class="muted">
      Turkizni loki so zaenkrat shematski prikaz zgornje
      polovice polja. To še niso fizikalno izračunane silnice.
      Ravnina tuljave je XZ, +Y kaže nad mizo.
    </p>

    <label>Kamera</label>
    <select id="cameraSelect">
      <option value="">Privzeta zadnja kamera</option>
    </select>

    <button id="reloadCamera" type="button">
      Uporabi izbrano kamero ↻
    </button>

    <button id="refreshCameras" type="button">
      Osveži seznam
    </button>

    <label>
      Korekcija merila:
      <b class="reading" id="calVal">1.00×</b>
    </label>
    <input id="cal" type="range"
           min="0.5" max="2" step="0.05" value="1">

    <label>
      OFFSET X:
      <b class="reading" id="xVal">0 cm</b>
    </label>
    <input id="x" type="range"
           min="-100" max="100" step="1" value="0">

    <label>
      OFFSET Y:
      <b class="reading" id="yVal">0 cm</b>
    </label>
    <input id="y" type="range"
           min="-100" max="100" step="1" value="0">

    <label>
      OFFSET Z:
      <b class="reading" id="zVal">-20 cm</b>
    </label>
    <input id="z" type="range"
           min="-100" max="100" step="1" value="-20">

    <label>
      XYZ SCALE:
      <b class="reading" id="scaleVal">10×</b>
    </label>
    <input id="scale" type="range"
           min="10" max="30" step="1" value="10">

    <label class="check">
      <input id="showField" type="checkbox" checked>
      Prikaži magnetno polje
    </label>

    <label>
      Število smeri silnic:
      <b class="reading" id="planesVal">8</b>
    </label>
    <input id="planes" type="range"
           min="4" max="16" step="2" value="8">

    <button id="reset" type="button">
      Ponastavi nastavitve
    </button>

    <p id="readout" class="muted"></p>
  </div>
</div>

<script>
/* ============================================================
   GLAVNE NASTAVITVE
   ============================================================ */

const MARKER_SIZE_CM = 3.5;

// Fizični polmer tuljave
const COIL_RADIUS_CM = 15;

// Shematski magnetni loki
const FIELD_ARC_RADII_CM = [6, 9, 12, 15, 18];

const FIELD_HEIGHT_RATIO = 0.90;
const FIELD_TUBE_RADIUS_CM = 0.14;
const FIELD_COLOR = '#35e9ff';

// Začetne nastavitve
const DEFAULTS = {
  x: 0,
  y: 0,
  z: -20,
  cal: 1,
  scale: 10,
  planes: 8,
  showField: true
};

// Pretvorba centimetrov v scenske enote AR.js
const SCENE_UNITS_PER_CM = 1 / MARKER_SIZE_CM;

/* ============================================================ */

(function () {
  'use strict';

  const $ = id => document.getElementById(id);

  const scene = document.querySelector('a-scene');
  const marker = $('target');
  const origin = $('coil-origin');
  const axes = $('axes');
  const field = $('field-root');
  const status = $('status');
  const diag = $('diag');

  let found = false;
  let loaded = false;

  let cfg = {...DEFAULTS};

  // Naloži shranjene nastavitve
  try {
    const saved = JSON.parse(localStorage.getItem('coilARv9'));

    if (saved && typeof saved === 'object') {
      for (const key of ['x','y','z','cal','scale','planes']) {
        if (Number.isFinite(Number(saved[key]))) {
          cfg[key] = Number(saved[key]);
        }
      }

      if (typeof saved.showField === 'boolean') {
        cfg.showField = saved.showField;
      }
    }
  } catch (e) {}

  // Odstrani staro magnetno polje
  function disposeField() {
    if (!field.object3D) return;

    const old = field.object3D.getObjectByName('fieldGroup');
    if (!old) return;

    old.traverse(o => {
      if (o.geometry) o.geometry.dispose();

      if (o.material) {
        const mats = Array.isArray(o.material)
          ? o.material : [o.material];

        mats.forEach(m => m.dispose());
      }
    });

    field.object3D.remove(old);
  }

  // Ustvari zgornje polkrožne loke
  function buildField() {
    if (!window.THREE || !field.object3D) return;

    disposeField();

    const group = new THREE.Group();
    group.name = 'fieldGroup';

    const material = new THREE.MeshBasicMaterial({
      color: FIELD_COLOR,
      transparent: true,
      opacity: 0.88,
      depthWrite: false
    });

    const segmentCount = 48;

    // Vsi loki so nad ravnino tuljave (Y >= 0)
    for (let i = 0; i < cfg.planes; i++) {
      const phi = Math.PI * i / cfg.planes;

      const dx = Math.cos(phi);
      const dz = Math.sin(phi);

      for (const radiusCm of FIELD_ARC_RADII_CM) {
        const points = [];

        for (let j = 0; j <= segmentCount; j++) {
          const t = Math.PI * j / segmentCount;

          points.push(
            new THREE.Vector3(
              dx * radiusCm * Math.cos(t),
              radiusCm * FIELD_HEIGHT_RATIO * Math.sin(t),
              dz * radiusCm * Math.cos(t)
            )
          );
        }

        const curve = new THREE.CatmullRomCurve3(points);

        const geometry = new THREE.TubeGeometry(
          curve,
          segmentCount,
          FIELD_TUBE_RADIUS_CM,
          5,
          false
        );

        group.add(new THREE.Mesh(geometry, material));
      }
    }

    // Oranžen obroč: fizična tuljava R = 15 cm
    const ringPoints = [];

    for (let i = 0; i <= 96; i++) {
      const a = 2 * Math.PI * i / 96;

      ringPoints.push(
        new THREE.Vector3(
          COIL_RADIUS_CM * Math.cos(a),
          0,
          COIL_RADIUS_CM * Math.sin(a)
        )
      );
    }

    const ringGeom = new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3(ringPoints),
      96,
      FIELD_TUBE_RADIUS_CM * 1.3,
      6,
      true
    );

    group.add(
      new THREE.Mesh(
        ringGeom,
        new THREE.MeshBasicMaterial({
          color: '#ffa64b',
          transparent: true,
          opacity: 0.75
        })
      )
    );

    field.object3D.add(group);
    applyFieldVisibilityAndScale();
  }

  // Pravilno merilo magnetnega polja
  function applyFieldVisibilityAndScale() {
    if (!field.object3D) return;

    const k = SCENE_UNITS_PER_CM * cfg.cal;

    field.object3D.scale.setScalar(k);
    field.object3D.visible = cfg.showField;
  }

  // Posodobi napise ob drsnikih
  function updateLabels() {
    $('calVal').textContent = cfg.cal.toFixed(2) + '×';

    for (const key of ['x','y','z']) {
      $(key + 'Val').textContent = cfg[key] + ' cm';
    }

    $('scaleVal').textContent = cfg.scale + '×';
    $('planesVal').textContent = cfg.planes;
  }

  // Uporabi vse nastavitve
  function apply() {
    cfg.cal = Math.max(0.5, Math.min(2, cfg.cal));
    cfg.scale = Math.max(10, Math.min(30, cfg.scale));
    cfg.planes = Math.max(
      4,
      Math.min(16, Math.round(cfg.planes / 2) * 2)
    );

    const k = SCENE_UNITS_PER_CM * cfg.cal;

    const pos = {
      x: cfg.x * k,
      y: cfg.y * k,
      z: cfg.z * k
    };

    // XYZ offset
    origin.setAttribute('position', pos);

    // Velikost osi
    axes.setAttribute('scale', {
      x: cfg.scale,
      y: cfg.scale,
      z: cfg.scale
    });

    if (origin.object3D) {
      origin.object3D.position.set(pos.x, pos.y, pos.z);
    }

    if (axes.object3D) {
      axes.object3D.scale.setScalar(cfg.scale);
    }

    applyFieldVisibilityAndScale();

    // Drsniki
    for (const key of ['x','y','z','cal','scale','planes']) {
      $(key).value = cfg[key];
    }

    $('showField').checked = cfg.showField;

    updateLabels();

    $('readout').textContent =
      `Izhodišče (${cfg.x}, ${cfg.y}, ${cfg.z}) cm · ` +
      `radij tuljave ${COIL_RADIUS_CM} cm · ` +
      `korekcija ${cfg.cal.toFixed(2)}×`;

    // Shrani nastavitve
    try {
      localStorage.setItem('coilARv9', JSON.stringify(cfg));
    } catch (e) {}
  }

  // XYZ sliderji
  for (const key of ['x','y','z','cal','scale']) {
    $(key).addEventListener('input', () => {
      cfg[key] = Number($(key).value);
      apply();
    });
  }

  // Število silnic
  $('planes').addEventListener('input', () => {
    cfg.planes = Number($('planes').value);
    apply();

    if (loaded) buildField();
  });

  // Vklop/izklop magnetnega polja
  $('showField').addEventListener('change', () => {
    cfg.showField = $('showField').checked;
    apply();
  });

  // Ponastavitev
  $('reset').addEventListener('click', () => {
    cfg = {...DEFAULTS};
    apply();

    if (loaded) buildField();
  });

  // Nastavitve: odpri/zapri
  $('toggle').addEventListener('click', () => {
    $('panel').classList.toggle('open');
  });

  // Marker zaznan
  marker.addEventListener('markerFound', () => {
    found = true;
    apply();
    status.textContent = '✓ Marker ID 5 zaznan — polje';
  });

  // Marker izgubljen
  marker.addEventListener('markerLost', () => {
    found = false;
    status.textContent = 'Marker izgubljen — pokaži ID 5';
  });

  // AR scena pripravljena
  scene.addEventListener('loaded', () => {
    loaded = true;
    apply();
    buildField();

    if (!found) {
      status.textContent = 'Marker v9 — usmeri telefon na ID 5';
    }
  });

  if (scene.hasLoaded) {
    loaded = true;
    apply();
    buildField();
  }

  // Napake
  window.addEventListener('error', event => {
    status.textContent = 'Napaka: ' +
      (event.message || 'neznana');
  });

  window.addEventListener('unhandledrejection', event => {
    status.textContent = 'Napaka: ' +
      String(event.reason || 'neznana');
  });

  // Seznam kamer
  async function cameras() {
    const select = $('cameraSelect');
    const picked = sessionStorage.getItem('coilCameraId') || '';

    select.replaceChildren(
      new Option('Privzeta zadnja kamera', '')
    );

    if (!navigator.mediaDevices?.enumerateDevices) return;

    try {
      const devices =
        (await navigator.mediaDevices.enumerateDevices())
        .filter(d => d.kind === 'videoinput');

      devices.forEach((d, i) => {
        select.add(
          new Option(d.label || `Kamera ${i + 1}`, d.deviceId)
        );
      });

      if ([...select.options].some(o => o.value === picked)) {
        select.value = picked;
      }

    } catch (e) {
      status.textContent = 'Kamere: ' + e.message;
    }
  }

  $('refreshCameras').addEventListener('click', cameras);

  $('reloadCamera').addEventListener('click', () => {
    const id = $('cameraSelect').value;

    if (id) {
      sessionStorage.setItem('coilCameraId', id);
    } else {
      sessionStorage.removeItem('coilCameraId');
    }

    // Ustavi prejšnji tok
    [...document.querySelectorAll('video')].forEach(v => {
      v.srcObject?.getTracks?.().forEach(t => t.stop());
    });

    location.reload();
  });

  // Kamera / layout / diagnostika
  function layout() {
    const video =
      [...document.querySelectorAll('video')]
      .find(v => v.srcObject)
      || document.querySelector('video');

    const canvas = scene.querySelector('canvas');

    if (video) {
      video.setAttribute('playsinline', '');
      video.muted = true;

      for (const [key, value] of Object.entries({
        position: 'fixed',
        top: '0',
        left: '0',
        width: '100vw',
        height: '100dvh',
        objectFit: 'cover',
        transform: 'none',
        zIndex: '0'
      })) {
        video.style.setProperty(
          key.replace(/[A-Z]/g, c => '-' + c.toLowerCase()),
          value,
          'important'
        );
      }
    }

    if (scene.renderer) {
      scene.renderer.setClearColor(0x000000, 0);
      scene.renderer.setClearAlpha(0);
    }

    if (canvas) {
      canvas.style.setProperty(
        'background',
        'transparent',
        'important'
      );
    }

    const track = video?.srcObject?.getVideoTracks?.()[0];

    diag.textContent =
      `Video ${video ? `${video.videoWidth}×${video.videoHeight}` : 'ni'} · ` +
      `${video?.paused ? 'premor' : 'predvaja'} · ` +
      `marker ${found ? 'DA' : 'NE'} · ` +
      `kamera ${track?.label || 'privzeta'}` +
      (window._cameraFallback
        ? ' · rezervna: ' + window._cameraFallback
        : '');
  }

  window.addEventListener('resize', layout);

  setInterval(layout, 900);
  setTimeout(cameras, 1800);

  apply();
  layout();

})();
</script>

</body>
</html>

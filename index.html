<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Coil AR — tracking test</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:system-ui,sans-serif; }
    #status { position:fixed; z-index:10; top:calc(env(safe-area-inset-top) + 14px); left:12px; right:12px; padding:12px 16px; border-radius:12px; background:rgba(0,0,0,.72); color:white; text-align:center; font-size:15px; pointer-events:none; }
    #info { position:fixed; z-index:10; bottom:calc(env(safe-area-inset-bottom) + 16px); left:12px; right:12px; color:white; background:rgba(0,0,0,.65); border-radius:12px; padding:10px; text-align:center; font-size:13px; pointer-events:none; }
    /* MindAR measures this scene to size the camera preview. */
    a-scene { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100dvh !important; display: block !important; }
    .a-enter-vr, .a-enter-ar { display:none !important; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Starting camera… please allow access.</div>
  <div id="info">v2: Aim at wood. Red = X, green = Y, blue = outward Z.</div>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: no; uiError: yes; filterMinCF: 0.0001; filterBeta: 10;"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="wood-target" mindar-image-target="targetIndex: 0">
      <!-- The target coordinate system: center of the cropped photograph. -->
      <!-- MindAR uses target width = 1; lengths here are relative to that width. -->
      <a-sphere position="0 0 0.015" radius="0.035" color="#ffffff"></a-sphere>
      <!-- X axis (red), horizontal on the wood -->
      <a-cylinder position="0.22 0 0.025" radius="0.009" height="0.44" rotation="0 0 -90" color="#ff3636"></a-cylinder>
      <a-cone position="0.46 0 0.025" radius-bottom="0.025" radius-top="0" height="0.08" rotation="0 0 -90" color="#ff3636"></a-cone>
      <!-- Y axis (green), vertical on the wood -->
      <a-cylinder position="0 0.22 0.025" radius="0.009" height="0.44" color="#41e66b"></a-cylinder>
      <a-cone position="0 0.46 0.025" radius-bottom="0.025" radius-top="0" height="0.08" color="#41e66b"></a-cone>
      <!-- Z axis (blue), perpendicular out from wooden surface -->
      <a-cylinder position="0 0 0.24" radius="0.009" height="0.44" rotation="90 0 0" color="#4a9cff"></a-cylinder>
      <a-cone position="0 0 0.48" radius-bottom="0.025" radius-top="0" height="0.08" rotation="90 0 0" color="#4a9cff"></a-cone>
      <!-- Small test object that should stay attached to the panel -->
      <a-box position="-0.20 -0.15 0.10" depth="0.17" height="0.17" width="0.17" color="#ffcf4b" material="opacity:0.9;transparent:true"></a-box>
    </a-entity>
  </a-scene>
  <script>
    // Show easily understandable feedback during the first tracking test.
    const statusEl = document.querySelector('#status');
    const targetEl = document.querySelector('#wood-target');
    const sceneEl = document.querySelector('a-scene');
    targetEl.addEventListener('targetFound', () => {
      statusEl.textContent = '✓ TRACKING — move your phone slowly';
      statusEl.style.background = 'rgba(12,100,55,.84)';
    });
    targetEl.addEventListener('targetLost', () => {
      statusEl.textContent = 'Target lost — aim at the wooden panel again';
      statusEl.style.background = 'rgba(0,0,0,.72)';
    });
    sceneEl.addEventListener('arReady', () => {
      statusEl.textContent = 'Camera ready — aim at the wooden panel (v2)';
    });
    sceneEl.addEventListener('arError', () => {
      statusEl.textContent = 'Camera/tracking error. Check permission, HTTPS and targets.mind.';
    });
  </script>
</body>
</html>

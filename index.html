<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coil AR — Marker v2</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101015;font-family:system-ui,Arial,sans-serif}
/* AR.js creates its own webcam video. Keep its original stream, but show it across the viewport. */
body>video,video.arjs-video,#arjs-video,body video{position:fixed!important;inset:0!important;left:0!important;top:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;object-fit:cover!important;transform:none!important;display:block!important;visibility:visible!important;opacity:1!important;z-index:1!important;background:#101015!important}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:2!important;background:transparent!important;pointer-events:none!important}
a-scene canvas{background:transparent!important;display:block!important}
.a-enter-vr,.a-enter-ar{display:none!important}
#panel{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:10000;display:flex;align-items:center;flex-direction:column;gap:8px}
#status,#diag{width:100%;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.82);color:white;text-align:center}
#diag{font-size:12px;color:#bfe6ff;overflow-wrap:anywhere}
#controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{background:#d6eaff;color:#122333;border:0;border-radius:12px;font-size:16px;font-weight:700;padding:12px 16px}
button:disabled{opacity:.5}
#tip{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;right:10px;z-index:10000;color:#fff;padding:10px;background:rgba(0,0,0,.77);border-radius:12px;text-align:center;font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="panel">
 <div id="status">Marker v2 — pritisni »Zaženi AR«</div>
 <div id="controls"><button id="start">Zaženi AR</button><button id="overlay" hidden>Skrij AR plast</button></div>
 <div id="diag">Kamera še ni zagnana.</div>
</div>
<div id="tip">Barcode 3×3 · ID 5 · 6 × 6 cm — pokaži celoten marker na zadnji strani tuljave.</div>
<script>
(()=>{
const status=document.querySelector('#status'),diag=document.querySelector('#diag'),start=document.querySelector('#start'),overlay=document.querySelector('#overlay');
let scene=null,enabled=false,hidden=false;
function currentVideo(){return [...document.querySelectorAll('video')].find(v=>v.srcObject)||document.querySelector('video');}
function setLayout(){
 const vid=currentVideo();if(vid){
   vid.muted=true;vid.playsInline=true;
   for(const [k,val] of Object.entries({position:'fixed',top:'0px',left:'0px',width:'100vw',height:'100vh','object-fit':'cover',transform:'none',display:'block',visibility:'visible',opacity:'1','z-index':'1'}))vid.style.setProperty(k,val,'important');
 }
 if(scene){scene.style.setProperty('position','fixed','important');scene.style.setProperty('inset','0','important');scene.style.setProperty('width','100vw','important');scene.style.setProperty('height','100vh','important');scene.style.setProperty('background','transparent','important');
 const canvas=scene.querySelector('canvas');if(canvas){canvas.style.setProperty('background','transparent','important');}
 if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0)}
 }
}
function diagnostics(){
const v=currentVideo(),r=v?.getBoundingClientRect(),c=scene?.querySelector('canvas'),cr=c?.getBoundingClientRect();
diag.textContent=`zaslon ${innerWidth}×${innerHeight} | kamera ${v?`${v.videoWidth}×${v.videoHeight}`:'ni videa'} ${v?(v.paused?'premor':v.readyState>=2?'predvaja':'nalaga'):''} | video ${r?`${Math.round(r.width)}×${Math.round(r.height)} x=${Math.round(r.x)}`:'—'} | AR ${cr?`${Math.round(cr.width)}×${Math.round(cr.height)}`:'—'}`;
}
function say(t){status.textContent=t;diagnostics();}
function startAR(){
 if(enabled)return;
 enabled=true;start.hidden=true;overlay.hidden=false;
 say('Marker v2 — zaganjam kamero…');
 scene=document.createElement('a-scene');
 scene.setAttribute('embedded','');
 scene.setAttribute('vr-mode-ui','enabled: false');
 scene.setAttribute('device-orientation-permission-ui','enabled: false');
 scene.setAttribute('renderer','alpha: true; antialias: true; logarithmicDepthBuffer: true');
 scene.setAttribute('arjs','sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;');
 scene.innerHTML=`
 <a-marker id="coilMarker" type="barcode" value="5" size="0.06" emitevents="true" smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
  <a-box position="0 0.01 0" width="0.015" height="0.02" depth="0.015" color="#ffd447"></a-box>
  <a-cylinder position="0.025 0.002 0" radius="0.0017" height="0.05" rotation="0 0 -90" color="#ff3838"></a-cylinder>
  <a-cylinder position="0 0.025 0" radius="0.0017" height="0.05" color="#38e35c"></a-cylinder>
  <a-cylinder position="0 0.002 0.025" radius="0.0017" height="0.05" rotation="90 0 0" color="#459bff"></a-cylinder>
 </a-marker><a-entity camera></a-entity>`;
 document.body.appendChild(scene);
 const marker=scene.querySelector('#coilMarker');
 marker.addEventListener('markerFound',()=>say('✓ Marker ID 5 zaznan — XYZ osi!'));
 marker.addEventListener('markerLost',()=>say('Marker izgubljen — približaj in pokaži celoten marker'));
 scene.addEventListener('loaded',()=>{setLayout();say('Marker v2 — scena pripravljena, usmeri kamero na ID 5')});
 const obs=new MutationObserver(()=>{setLayout();diagnostics()});obs.observe(document.body,{childList:true,subtree:true});
 setLayout();diagnostics();
}
start.addEventListener('click',startAR);
overlay.addEventListener('click',()=>{hidden=!hidden;scene.style.opacity=hidden?'0':'1';overlay.textContent=hidden?'Pokaži AR plast':'Skrij AR plast';diagnostics();});
window.addEventListener('resize',()=>{setLayout();diagnostics()});
window.addEventListener('error',e=>say('Napaka: '+(e.message||'neznana')));
setInterval(()=>{if(enabled){setLayout();diagnostics()}},900);
})();
</script>
</body>
</html>

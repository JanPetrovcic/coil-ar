<script>
// Izbira kamere brez dodatnega video toka
(() => {
  if (!navigator.mediaDevices?.getUserMedia) return;

  const original = navigator.mediaDevices.getUserMedia.bind(
    navigator.mediaDevices
  );
  const id = sessionStorage.getItem('coilCameraId');

  if (!id) return;

  navigator.mediaDevices.getUserMedia = async constraints => {
    if (!constraints?.video) return original(constraints);

    const video = typeof constraints.video === 'object'
      ? {...constraints.video} : {};

    delete video.facingMode;
    video.deviceId = {exact:id};

    try {
      return await original({...constraints,video});
    } catch (e) {
      window.cameraFallback = e.name;
      return original(constraints);
    }
  };
})();
</script>

<script>
/* ============================================================
   FIZIKALNE NASTAVITVE
   ============================================================ */

// Marker in tuljava v centimetrih
const MARKER_SIZE_CM = 3.5;
const COIL_RADIUS_CM = 15;

// Začetne lokacije za izračun silnic
const FIELD_SEED_RADII_CM = [3, 6, 9, 12, 13.8];

// Numerični izračun
const FIELD_WIRE_SEGMENTS = 96;
const FIELD_STEP_CM = 0.40;
const FIELD_MAX_STEPS = 320;

// Omejitve prikazanega prostora
const FIELD_MAX_HEIGHT_CM = 42;
const FIELD_MAX_RADIUS_CM = 45;

// Barve
const FIELD_COLOR = 0x35e9ff;
const ARROW_COLOR = 0xffec65;

// Pretvorba cm v koordinatni sistem AR.js
const SCENE_UNITS_PER_CM = 1 / MARKER_SIZE_CM;

// Začetne nastavitve
const DEFAULTS = {
  x: 0,
  y: 0,
  z: -20,
  cal: 1,
  scale: 10,
  planes: 8,
  speed: 0.15,
  direction: 1,
  showField: true,
  showArrows: true
};

/* ============================================================
   GLAVNI PROGRAM
   ============================================================ */

(() => {
'use strict';

const $ = id => document.getElementById(id);

const scene = document.querySelector('a-scene');

const marker = $('target');
const origin = $('coil-origin');
const axes = $('axes');
const field = $('field-root');

const status = $('status');
const diag = $('diag');

let cfg = {...DEFAULTS};

let sceneReady = false;
let found = false;
let initialized = false;

let wire = null;
let arrows = [];
let oldGroup = null;
let animPhase = 0;

const UP = new THREE.Vector3(0,1,0);

/* ============================================================
   SHRANJENE NASTAVITVE
   ============================================================ */

try {
  const saved = JSON.parse(
    localStorage.getItem('coilARv10') ||
    localStorage.getItem('coilARv9') ||
    'null'
  );

  if (saved && typeof saved === 'object') {

    for (const key of [
      'x','y','z','cal','scale',
      'planes','speed','direction'
    ]) {
      if (
        saved[key] !== undefined &&
        Number.isFinite(Number(saved[key]))
      ) {
        cfg[key] = Number(saved[key]);
      }
    }

    for (const key of ['showField','showArrows']) {
      if (typeof saved[key] === 'boolean') {
        cfg[key] = saved[key];
      }
    }
  }
} catch (e) {}

/* ============================================================
   BIOT–SAVART: KROŽNI VODNIK
   ============================================================ */

// Tuljava leži v XZ ravnini.
// Za izračun smeri polja konstanta mu0*I/(4*pi)
// ni potrebna, ker vektor B normiramo.

function makeWire() {

  const arr = [];

  for (let i=0; i<FIELD_WIRE_SEGMENTS; i++) {

    const a = 2*Math.PI*i/FIELD_WIRE_SEGMENTS;
    const b = 2*Math.PI*(i+1)/FIELD_WIRE_SEGMENTS;

    const ax = COIL_RADIUS_CM*Math.cos(a);
    const az = COIL_RADIUS_CM*Math.sin(a);

    const bx = COIL_RADIUS_CM*Math.cos(b);
    const bz = COIL_RADIUS_CM*Math.sin(b);

    arr.push({
      mx: (ax+bx)/2,
      mz: (az+bz)/2,
      dx: bx-ax,
      dz: bz-az
    });
  }

  return arr;
}

// Izračuna smer magnetnega polja v točki p
function fieldDirection(p) {

  let bx=0, by=0, bz=0;

  for (const s of wire) {

    const rx = p.x-s.mx;
    const ry = p.y;
    const rz = p.z-s.mz;

    // Numerična regularizacija blizu vodnika
    const r2 = rx*rx+ry*ry+rz*rz+0.035;
    const q = 1/(r2*Math.sqrt(r2));

    // dl × r
    bx += (-s.dz*ry)*q;
    by += (s.dz*rx-s.dx*rz)*q;
    bz += (s.dx*ry)*q;
  }

  const n = Math.hypot(bx,by,bz);

  if (n <= 1e-12) return null;

  return new THREE.Vector3(
    bx/n,
    by/n,
    bz/n
  );
}

/* ============================================================
   NUMERIČNO SLEDENJE SILNIC — RK4
   ============================================================ */

function advance(p,h) {

  const k1 = fieldDirection(p);
  if (!k1) return null;

  const k2 = fieldDirection(
    p.clone().addScaledVector(k1,h/2)
  );
  if (!k2) return null;

  const k3 = fieldDirection(
    p.clone().addScaledVector(k2,h/2)
  );
  if (!k3) return null;

  const k4 = fieldDirection(
    p.clone().addScaledVector(k3,h)
  );
  if (!k4) return null;

  const d = k1
    .addScaledVector(k2,2)
    .addScaledVector(k3,2)
    .add(k4)
    .multiplyScalar(h/6);

  return p.clone().add(d);
}

// Sledi silnici v eno smer
function trace(seed,sign) {

  const points = [seed.clone()];
  let p = seed.clone();

  for (let i=0; i<FIELD_MAX_STEPS; i++) {

    const next = advance(
      p,
      sign*FIELD_STEP_CM
    );

    if (!next) break;

    const r = Math.hypot(next.x,next.z);

    const wireDistance = Math.hypot(
      r-COIL_RADIUS_CM,
      next.y
    );

    // Izognemo se neposredni bližini vodnika
    if (wireDistance < 0.45) break;

    // Omejitev prikaza
    if (r > FIELD_MAX_RADIUS_CM) break;
    if (next.y > FIELD_MAX_HEIGHT_CM) break;

    // Prikažemo samo nad ravnino tuljave
    if (next.y < 0) {

      if (p.y > 0 && next.y !== p.y) {

        const u = p.y/(p.y-next.y);

        points.push(
          p.clone().lerp(next,u)
        );
      }

      break;
    }

    points.push(next);
    p = next;
  }

  return points;
}

// Zgradi eno silnico z obema smerema
function seedLine(r) {

  const seed = new THREE.Vector3(
    r,
    0.65,
    0
  );

  const back = trace(seed,-1).reverse();
  const forward = trace(seed,1);

  return back.concat(
    forward.slice(1)
  );
}

// Zasuk silnice okoli osi Y
function rotateAroundY(p,phi) {

  const c = Math.cos(phi);
  const s = Math.sin(phi);

  return new THREE.Vector3(
    p.x*c-p.z*s,
    p.y,
    p.x*s+p.z*c
  );
}

/* ============================================================
   GRADNJA 3D MAGNETNEGA POLJA
   ============================================================ */

function removeField() {

  arrows = [];

  if (!oldGroup) return;

  oldGroup.traverse(obj => {

    if (obj.geometry) {
      obj.geometry.dispose();
    }

    if (obj.material) {

      const materials = Array.isArray(obj.material)
        ? obj.material
        : [obj.material];

      materials.forEach(m => m.dispose());
    }
  });

  field.object3D.remove(oldGroup);
  oldGroup = null;
}

function buildField() {

  if (!sceneReady || !field.object3D) return;

  removeField();

  if (!wire) {
    wire = makeWire();
  }

  const group = new THREE.Group();
  group.name = 'fieldGroup';

  oldGroup = group;

  const lineMat = new THREE.LineBasicMaterial({
    color: FIELD_COLOR,
    transparent: true,
    opacity: 0.94
  });

  const arrowMat = new THREE.MeshBasicMaterial({
    color: ARROW_COLOR,
    depthTest: true
  });

  // Konica puščice je usmerjena v +Y
  const arrowGeometry = new THREE.ConeGeometry(
    0.50,
    1.55,
    6
  );

  // Najprej izračunamo silnice v enem prerezu
  const bases = FIELD_SEED_RADII_CM
    .map(seedLine)
    .filter(pts => pts.length >= 10);

  // Nato jih razporedimo okoli cele tuljave
  for (let a=0; a<cfg.planes; a++) {

    const phi = 2*Math.PI*a/cfg.planes;

    for (const base of bases) {

      const points = base.map(
        p => rotateAroundY(p,phi)
      );

      const curve = new THREE.CatmullRomCurve3(
        points,
        false,
        'centripetal'
      );

      const sampled = curve.getSpacedPoints(
        Math.max(
          32,
          Math.min(180,points.length)
        )
      );

      // Turkizna silnica
      const lineGeometry =
        new THREE.BufferGeometry()
          .setFromPoints(sampled);

      group.add(
        new THREE.Line(
          lineGeometry,
          lineMat
        )
      );

      // Dve animirani puščici na silnico
      for (let k=0; k<2; k++) {

        const head = new THREE.Mesh(
          arrowGeometry,
          arrowMat
        );

        group.add(head);

        arrows.push({
          head,
          curve,
          phase:k/2+(a%3)*0.11
        });
      }
    }
  }

  // Oranžen obroč — položaj fizične tuljave
  const ringPts = [];

  for (let i=0; i<=120; i++) {

    const t = 2*Math.PI*i/120;

    ringPts.push(
      new THREE.Vector3(
        COIL_RADIUS_CM*Math.cos(t),
        0,
        COIL_RADIUS_CM*Math.sin(t)
      )
    );
  }

  const ringGeometry =
    new THREE.BufferGeometry()
      .setFromPoints(ringPts);

  const ringMaterial =
    new THREE.LineBasicMaterial({
      color:0xffa34d,
      transparent:true,
      opacity:0.8
    });

  group.add(
    new THREE.Line(
      ringGeometry,
      ringMaterial
    )
  );

  field.object3D.add(group);

  applyFieldScale();
}

function applyFieldScale() {

  if (!field.object3D) return;

  field.object3D.scale.setScalar(
    SCENE_UNITS_PER_CM*cfg.cal
  );

  field.object3D.visible=cfg.showField;
}

/* ============================================================
   NASTAVITVE IN SLIDERJI
   ============================================================ */

function updateLabels() {

  $('calVal').textContent =
    cfg.cal.toFixed(2)+'×';

  for (const a of ['x','y','z']) {
    $(a+'Val').textContent =
      cfg[a]+' cm';
  }

  $('scaleVal').textContent =
    cfg.scale+'×';

  $('planesVal').textContent =
    cfg.planes;

  $('speedVal').textContent =
    cfg.speed.toFixed(3);

  $('directionVal').textContent =
    cfg.direction>0 ? '+1' : '−1';
}

function apply() {

  cfg.cal = Math.max(
    0.5,
    Math.min(2,cfg.cal)
  );

  cfg.scale = Math.max(
    10,
    Math.min(30,cfg.scale)
  );

  cfg.planes = Math.max(
    4,
    Math.min(
      16,
      Math.round(cfg.planes/2)*2
    )
  );

  cfg.speed = Math.max(
    0,
    Math.min(0.6,cfg.speed)
  );

  cfg.direction =
    cfg.direction<0 ? -1 : 1;

  const k =
    SCENE_UNITS_PER_CM*cfg.cal;

  const pos = {
    x:cfg.x*k,
    y:cfg.y*k,
    z:cfg.z*k
  };

  // Premik skupnega izhodišča
  origin.setAttribute('position',pos);

  // Povečava koordinatnega sistema
  axes.setAttribute('scale',{
    x:cfg.scale,
    y:cfg.scale,
    z:cfg.scale
  });

  origin.object3D?.position.set(
    pos.x,
    pos.y,
    pos.z
  );

  axes.object3D?.scale.setScalar(
    cfg.scale
  );

  applyFieldScale();

  // Osveži vrednosti drsnikov
  for (const key of [
    'x','y','z','cal',
    'scale','planes','speed','direction'
  ]) {
    $(key).value=cfg[key];
  }

  $('showField').checked =
    cfg.showField;

  $('showArrows').checked =
    cfg.showArrows;

  updateLabels();

  $('readout').textContent =
    `Izhodišče (${cfg.x}, ${cfg.y}, ${cfg.z}) cm · ` +
    `R = ${COIL_RADIUS_CM} cm · ` +
    `faktor ${cfg.cal.toFixed(2)}×`;

  // Shrani nastavitve
  try {
    localStorage.setItem(
      'coilARv10',
      JSON.stringify(cfg)
    );
  } catch(e) {}
}

// Običajni drsniki
for (const key of [
  'x','y','z','cal',
  'scale','speed','direction'
]) {

  $(key).addEventListener('input',() => {

    cfg[key]=Number($(key).value);

    apply();
  });
}

// Število smeri zahteva ponoven izračun geometrije
$('planes').addEventListener('change',() => {

  cfg.planes=Number(
    $('planes').value
  );

  apply();
  buildField();
});

// Vklop polja
$('showField').addEventListener('change',() => {

  cfg.showField=
    $('showField').checked;

  apply();
});

// Vklop animiranih puščic
$('showArrows').addEventListener('change',() => {

  cfg.showArrows=
    $('showArrows').checked;

  apply();
});

// Ponastavitev
$('reset').addEventListener('click',() => {

  cfg={...DEFAULTS};

  apply();
  buildField();
});

// Odpiranje nastavitev
$('toggle').addEventListener('click',() => {

  $('panel').classList.toggle('open');
});

/* ============================================================
   ANIMACIJA PUŠČIC
   ============================================================ */

// Animacija uporablja A-Frame tick, zato ni treba
// ustvarjati drugega render loopa.

AFRAME.registerComponent(
  'field-animation',
  {
    tick:function(time,dt) {

      if (
        !cfg.showField ||
        !cfg.showArrows ||
        !found ||
        !arrows.length
      ) {

        for (const item of arrows) {
          item.head.visible=false;
        }

        return;
      }

      if (Number.isFinite(dt)) {

        animPhase +=
          Math.min(dt/1000,0.08) *
          cfg.speed *
          cfg.direction;
      }

      for (const item of arrows) {

        // Ciklično gibanje med 0 in 1
        const u = (
          (animPhase+item.phase)%1+1
        )%1;

        const pos =
          item.curve.getPointAt(u);

        const tan =
          item.curve.getTangentAt(u)
            .normalize();

        if (cfg.direction<0) {
          tan.negate();
        }

        item.head.position.copy(pos);

        item.head.quaternion
          .setFromUnitVectors(UP,tan);

        item.head.visible=true;
      }
    }
  }
);

scene.setAttribute(
  'field-animation',
  ''
);

/* ============================================================
   AR MARKER IN ZAGON
   ============================================================ */

marker.addEventListener('markerFound',() => {

  found=true;

  status.textContent =
    '✓ Marker ID 5 zaznan — Biot–Savart';
});

marker.addEventListener('markerLost',() => {

  found=false;

  status.textContent =
    'Marker izgubljen — pokaži ID 5';
});

function initScene() {

  if (initialized) return;

  initialized=true;
  sceneReady=true;

  apply();
  buildField();

  if (!found) {

    status.textContent =
      'Marker v10 — usmeri telefon na ID 5';
  }
}

scene.addEventListener(
  'loaded',
  initScene
);

if (scene.hasLoaded) {
  initScene();
}

// Diagnostika napak
window.addEventListener('error',e => {

  status.textContent =
    'Napaka: '+(e.message||'neznana');
});

window.addEventListener('unhandledrejection',e => {

  status.textContent =
    'Napaka: '+
    String(e.reason||'neznana');
});

/* ============================================================
   IZBIRA KAMERE
   ============================================================ */

async function cameras() {

  const select=$('cameraSelect');

  const chosen=
    sessionStorage.getItem('coilCameraId')||'';

  select.replaceChildren(
    new Option(
      'Privzeta zadnja kamera',
      ''
    )
  );

  if (!navigator.mediaDevices?.enumerateDevices) {
    return;
  }

  try {

    const items=(
      await navigator.mediaDevices.enumerateDevices()
    ).filter(d => d.kind==='videoinput');

    items.forEach((d,i) => {

      select.add(
        new Option(
          d.label||`Kamera ${i+1}`,
          d.deviceId
        )
      );
    });

    if (
      [...select.options].some(
        o => o.value===chosen
      )
    ) {
      select.value=chosen;
    }

  } catch(e) {

    console.warn('Kamere:',e);
  }
}

$('refreshCameras').addEventListener(
  'click',
  cameras
);

$('reloadCamera').addEventListener(
  'click',
  () => {

    const id=$('cameraSelect').value;

    if (id) {
      sessionStorage.setItem(
        'coilCameraId',
        id
      );
    } else {
      sessionStorage.removeItem(
        'coilCameraId'
      );
    }

    // Ustavi prejšnji video tok
    [...document.querySelectorAll('video')]
      .forEach(v => {
        v.srcObject?.getTracks()
          .forEach(t => t.stop());
      });

    location.reload();
  }
);

/* ============================================================
   VIDEO PRIKAZ IN DIAGNOSTIKA
   ============================================================ */

function diagnostics() {

  const video=[
    ...document.querySelectorAll('video')
  ].find(v => v.srcObject)
    ||document.querySelector('video');

  const canvas=
    scene.querySelector('canvas');

  if (video) {

    video.setAttribute(
      'playsinline',
      ''
    );

    video.muted=true;

    const videoStyle={
      position:'fixed',
      top:'0',
      left:'0',
      width:'100vw',
      height:'100dvh',
      objectFit:'cover',
      transform:'none',
      zIndex:'0'
    };

    for (
      const [key,val] of
      Object.entries(videoStyle)
    ) {

      video.style.setProperty(
        key.replace(
          /[A-Z]/g,
          c=>'-'+c.toLowerCase()
        ),
        val,
        'important'
      );
    }
  }

  if (scene.renderer) {

    scene.renderer.setClearColor(0,0);
    scene.renderer.setClearAlpha(0);
  }

  if (canvas) {

    canvas.style.setProperty(
      'background',
      'transparent',
      'important'
    );
  }

  const track=
    video?.srcObject
      ?.getVideoTracks?.()[0];

  diag.textContent =
    `Video ${
      video
      ? `${video.videoWidth}×${video.videoHeight}`
      : 'ni'
    } · ${
      video?.paused
      ? 'premor'
      : 'predvaja'
    } · marker ${
      found ? 'DA':'NE'
    } · kamera ${
      track?.label||'privzeta'
    }${
      window.cameraFallback
      ? ' · rezerva '+window.cameraFallback
      : ''
    }`;
}

window.addEventListener(
  'resize',
  diagnostics
);

setInterval(
  diagnostics,
  950
);

setTimeout(
  cameras,
  1800
);

apply();
diagnostics();

})();
</script>

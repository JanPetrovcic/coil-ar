<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<title>Coil AR - ID 5, XYZ -7 cm</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font:15px/1.35 system-ui,-apple-system,sans-serif; color:#fff; background:#10141c; }
  #app { display:flex; flex-direction:column; height:100%; min-height:0; }
  header { flex:none; padding:10px 14px; background:#1b2431; border-bottom:1px solid #344052; }
  header h1 { margin:0 0 4px; font-size:17px; }
  header p { margin:0; font-size:13px; color:#bfcde0; }
  .stage { position:relative; flex:1; min-height:0; overflow:hidden; background:#000; }
  .stage > canvas { display:block; width:100%; height:100%; }
  .stage > video { display:none; }
  #centerMessage { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:10px 17px; background:rgba(3,14,22,.82); border:1px solid #7190a8; border-radius:10px; font-weight:700; text-align:center; pointer-events:none; }
  #centerMessage.found { background:#075b32; border-color:#8ef0b8; }
  #centerMessage[hidden] { display:none; }
  .diagnostics { position:absolute; left:12px; right:12px; bottom:12px; padding:10px 12px; background:rgba(12,18,26,.86); border:1px solid #4a5a72; border-radius:11px; display:grid; gap:4px; font-size:12px; overflow-wrap:anywhere; }
  .diagnostics strong { font-size:15px; }
  .diagnostics.good { border-color:#48ce88; }
  .diagnostics.error { border-color:#e58c8c; }
  .dim { color:#b6c7d9; }
  footer { flex:none; background:#1b2431; padding:9px 12px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  button, a.action { border:1px solid #91b5d0; color:#fff; background:#284459; padding:9px 12px; border-radius:8px; text-decoration:none; font:inherit; cursor:pointer; }
  footer small { color:#bfcde0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Coil AR – koordinatni sistem XYZ</h1>
    <p>ID 5 · izhodišče Z = −8 cm · X rdeča, Y zelena, Z modra</p>
  </header>
  <main id="cameraStage" class="stage">
    <video id="cameraSource" autoplay muted playsinline></video>
    <canvas id="cameraCanvas" aria-label="Prikaz kamere z AR koordinatnim sistemom"></canvas>
    <div id="centerMessage">Začenjam kamero …</div>
    <section class="diagnostics" id="diagnostics" role="status" aria-live="polite">
      <strong id="result">Začenjam …</strong>
      <div id="cameraState">Kamera: čakam</div>
      <div id="detectorState">Detektor: čakam</div>
      <div id="idState">Videni ID-ji: —</div>
      <div class="dim" id="hint">Pokaži marker ID 5 pred kamero.</div>
    </section>
  </main>
  <footer>
    <button id="restartButton" type="button">Ponovno zaženi kamero</button>
    <small>Enak zajem in prikaz kamere kot v delujočem canvas testu.</small>
  </footer>
</div>
<script>
(() => {
  // FIZIČNO MERILO. Enota poze ARToolKit je mm, ker
  // getTransMatSquare spodaj dobi fizično širino 35 mm.
  const MARKER_ID = 5;
  const MARKER_WIDTH_MM = 35;
  const ORIGIN_Z_MM = -70;  // natanko -7 cm po naši osi Z
  const AXIS_LENGTH_MM = 50;

  const stage = document.getElementById('cameraStage');
  const video = document.getElementById('cameraSource');
  const canvas = document.getElementById('cameraCanvas');
  const ctx = canvas.getContext('2d');
  const centerMessage = document.getElementById('centerMessage');
  const diagnostics = document.getElementById('diagnostics');
  const resultEl = document.getElementById('result');
  const cameraState = document.getElementById('cameraState');
  const detectorState = document.getElementById('detectorState');
  const idState = document.getElementById('idState');
  const hint = document.getElementById('hint');
  const restartButton = document.getElementById('restartButton');
  const detectCanvas = document.createElement('canvas');
  const detectCtx = detectCanvas.getContext('2d', {willReadFrequently:true});

  let stream=null, controller=null, cameraParam=null, frameId=0;
  let width=0, height=0, currentIds=[], currentMarkers=[];
  let lastDetectionAt=0, processedFrames=0, cameraReady=false;
  let detectorReady=false, detectorError=false, runId=0, lastUIAt=0;
  let markerPose=null, projection=null;
  const mat12 = new Float32Array(12);
  const mat16 = new Float32Array(16);

  // NESPReMENJENO: enak canvas, DPR in dimenzioniranje kot v osnovnem testu.
  function updateDimensions() {
    const rect=stage.getBoundingClientRect();
    width=rect.width; height=rect.height;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const pixelWidth=Math.max(1,Math.round(width*dpr));
    const pixelHeight=Math.max(1,Math.round(height*dpr));
    if(canvas.width!==pixelWidth) canvas.width=pixelWidth;
    if(canvas.height!==pixelHeight) canvas.height=pixelHeight;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  const resizeObserver=new ResizeObserver(updateDimensions);
  resizeObserver.observe(stage);
  updateDimensions();

  function showError(message) {
    detectorError=true;
    diagnostics.classList.remove('good');
    diagnostics.classList.add('error');
    resultEl.textContent='Napaka pri testu';
    hint.textContent=message;
    centerMessage.textContent='Napaka pri testu';
    centerMessage.hidden=false;
    centerMessage.classList.remove('found');
    console.error(message);
  }

  // Množenje 4x4 matrike (column-major), brez WebGL ali nove kamere.
  function mul4(m, v) {
    return [
      m[0]*v[0]+m[4]*v[1]+m[8]*v[2]+m[12]*v[3],
      m[1]*v[0]+m[5]*v[1]+m[9]*v[2]+m[13]*v[3],
      m[2]*v[0]+m[6]*v[1]+m[10]*v[2]+m[14]*v[3],
      m[3]*v[0]+m[7]*v[1]+m[11]*v[2]+m[15]*v[3]
    ];
  }

  // Koordinatne osi za tuljavo (A-Frame konvencija):
  // X je v ravnini markerja, Y pravokotno nad markerjem,
  // Z je v ravnini markerja. ARToolKit interno uporablja
  // drugo bazo: (x, y, z)_naše -> (x, -z, y)_ARToolKit.
  function toMarker(x,y,z) { return [x,-z,y,1]; }

  function project(x,y,z,ox,oy,scale) {
    if (!markerPose || !projection) return null;
    const cameraPoint=mul4(markerPose,toMarker(x,y,z));
    const clip=mul4(projection,cameraPoint);
    if(!Number.isFinite(clip[3]) || Math.abs(clip[3])<1e-7) return null;
    const nx=clip[0]/clip[3], ny=clip[1]/clip[3];
    if(!Number.isFinite(nx)||!Number.isFinite(ny)) return null;
    // Matrika uporablja dimenzije detekcijskega canvasa.
    const px=(nx+1)*0.5*detectCanvas.width;
    const py=(1-ny)*0.5*detectCanvas.height;
    return {x:ox+px*scale,y:oy+py*scale};
  }

  function arrow(start,end,color,label) {
    if(!start || !end) return;
    const dx=end.x-start.x,dy=end.y-start.y;
    const distance=Math.hypot(dx,dy);
    if(distance<1) return;
    const ux=dx/distance,uy=dy/distance;
    const head=Math.min(15,Math.max(7,distance*.18));
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=4;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(start.x,start.y); ctx.lineTo(end.x,end.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(end.x,end.y);
    ctx.lineTo(end.x-ux*head-uy*head*.5,end.y-uy*head+ux*head*.5);
    ctx.lineTo(end.x-ux*head+uy*head*.5,end.y-uy*head-ux*head*.5);
    ctx.closePath(); ctx.fill();
    ctx.font='bold 19px system-ui'; ctx.lineWidth=3;
    ctx.strokeStyle='#10141c'; ctx.strokeText(label,end.x+7,end.y-7);
    ctx.fillText(label,end.x+7,end.y-7);
  }

  function drawAxes(ox,oy,scale) {
    const z=ORIGIN_Z_MM, len=AXIS_LENGTH_MM;
    const origin=project(0,0,z,ox,oy,scale);
    if(!origin) return;
    const xp=project(len,0,z,ox,oy,scale);
    const yp=project(0,len,z,ox,oy,scale);
    const zp=project(0,0,z+len,ox,oy,scale);
    arrow(origin,xp,'#ff4242','X');
    arrow(origin,yp,'#42ff79','Y');
    arrow(origin,zp,'#4094ff','Z');
    ctx.fillStyle='#fff'; ctx.strokeStyle='#111'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(origin.x,origin.y,5,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
  }

  function drawMarkerOutline(marker,ox,oy,scale) {
    const corners=marker.vertex;
    if(!Array.isArray(corners)||corners.length<4) return;
    const pts=corners.slice(0,4).map(p=>({
      x:Number(Array.isArray(p)?p[0]:p.x),
      y:Number(Array.isArray(p)?p[1]:p.y)
    }));
    if(pts.some(p=>!Number.isFinite(p.x)||!Number.isFinite(p.y))) return;
    ctx.beginPath();
    pts.forEach((p,i)=>i?ctx.lineTo(ox+p.x*scale,oy+p.y*scale):ctx.moveTo(ox+p.x*scale,oy+p.y*scale));
    ctx.closePath(); ctx.lineWidth=3; ctx.strokeStyle='#32fa80'; ctx.stroke();
    ctx.font='bold 18px system-ui'; ctx.fillStyle='#32fa80';
    ctx.fillText('ID 5',ox+pts[0].x*scale,Math.max(24,oy+pts[0].y*scale-10));
  }

  // NESPReMENJENO: contain izris in zaznava istega neobrezanega vira.
  function render(timestamp) {
    frameId=requestAnimationFrame(render);
    ctx.fillStyle='#000'; ctx.fillRect(0,0,width,height);
    if(!cameraReady||video.readyState<HTMLMediaElement.HAVE_CURRENT_DATA||!width||!height) return;
    const vw=video.videoWidth, vh=video.videoHeight;
    const displayScale=Math.min(width/vw,height/vh);
    const viewWidth=vw*displayScale, viewHeight=vh*displayScale;
    const ox=(width-viewWidth)/2, oy=(height-viewHeight)/2;
    ctx.drawImage(video,ox,oy,viewWidth,viewHeight);

    if(detectorReady && timestamp-lastDetectionAt>=110) {
      lastDetectionAt=timestamp;
      try {
        detectCtx.drawImage(video,0,0,detectCanvas.width,detectCanvas.height);
        currentIds=[]; currentMarkers=[];
        markerPose=null;
        controller.process(detectCanvas);
        processedFrames++;

        // DODANO: iz iste detekcije izračun poze z merilom v mm.
        // NE spremeni kamere ali velikosti detekcijskega canvasa.
        const count=controller.getMarkerNum();
        for(let i=0;i<count;i++) {
          const marker=controller.getMarker(i);
          if(marker?.idMatrix!==MARKER_ID) continue;
          controller.getTransMatSquare(i,MARKER_WIDTH_MM,mat12);
          controller.transMatToGLMat(mat12,mat16);
          markerPose=new Float32Array(mat16);
          break;
        }
      } catch(err) {
        detectorReady=false;
        detectorState.textContent='Detektor: napaka med obdelavo';
        showError('Zaznavanje ni uspelo: '+err.message);
      }
    }

    const markerScale=viewWidth/detectCanvas.width;
    if(currentIds.includes(MARKER_ID)) {
      currentMarkers.filter(m=>m.idMatrix===MARKER_ID).forEach(m=>drawMarkerOutline(m,ox,oy,markerScale));
      drawAxes(ox,oy,markerScale);
    }

    if(!detectorError && timestamp-lastUIAt>150) {
      lastUIAt=timestamp;
      const found=currentIds.includes(MARKER_ID);
      diagnostics.classList.toggle('good',found);
      diagnostics.classList.remove('error');
      resultEl.textContent=!detectorReady?'Čakam detektor …':found?'✓ ID 5 zaznan · XYZ: Z = −8 cm':'Marker ID 5 trenutno ni zaznan';
      idState.textContent='Videni ID-ji: '+(currentIds.length?[...new Set(currentIds)].join(', '):'nobenega');
      detectorState.textContent=detectorReady?'Detektor: pripravljen, obdelanih slik: '+processedFrames:'Detektor: inicializacija …';
      centerMessage.hidden=true;
      hint.textContent=found?'Zeleni obris je na markerju; beležimo fizični odmik 80 mm.':'Pokaži celoten marker ID 5 v dobro osvetljeni kameri.';
    }
  }

  function loadARToolkit() {
    return new Promise((resolve,reject)=>{
      if(window.ARController && window.artoolkit && typeof window.artoolkit.setup==='function') return resolve();
      let done=false;
      const timeout=setTimeout(()=>finish(new Error('Knjižnica ARToolKit se ni inicializirala.')),20000);
      function finish(err) {
        if(done) return;
        done=true; clearTimeout(timeout);
        window.removeEventListener('artoolkit-loaded',onReady);
        if(err) reject(err); else resolve();
      }
      function onReady(){finish();}
      window.addEventListener('artoolkit-loaded',onReady);
      const script=document.createElement('script');
      script.src='https://www.artoolkitx.org/jsartoolkit5/build/artoolkit.min.js';
      script.async=true;
      script.onerror=()=>finish(new Error('Knjižnice ARToolKit ni mogoče prenesti.'));
      script.onload=()=>{if(window.ARController&&window.artoolkit&&typeof window.artoolkit.setup==='function')finish();};
      document.head.appendChild(script);
    });
  }

  function loadCameraParameters() {
    return new Promise((resolve,reject)=>{
      cameraParam=new ARCameraParam(
        'https://www.artoolkitx.org/jsartoolkit5/examples/Data/camera_para.dat',
        ()=>resolve(cameraParam),
        error=>reject(new Error('Kalibracije ni mogoče naložiti: '+error))
      );
    });
  }

  function createDetector(param) {
    return new Promise((resolve,reject)=>{
      try {
        controller=new ARController(detectCanvas,param);
        controller.onload=()=>{
          try {
            controller.setPatternDetectionMode(artoolkit.AR_MATRIX_CODE_DETECTION);
            controller.setMatrixCodeType(artoolkit.AR_MATRIX_CODE_3x3);
            controller.addEventListener('getMarker',event=>{
              const marker=event?.data?.marker;
              if(!marker) return;
              if(Number.isInteger(marker.idMatrix)&&marker.idMatrix>=0) {
                currentIds.push(marker.idMatrix);
                currentMarkers.push(marker);
              }
            });
            projection=new Float32Array(controller.getCameraMatrix());
            detectorReady=true;
            resolve();
          } catch(e) {reject(e);}
        };
      } catch(e) {reject(e);}
    });
  }

  async function restart() {
    const myRun=++runId;
    cancelAnimationFrame(frameId);
    if(stream) stream.getTracks().forEach(track=>track.stop());
    stream=null; cameraReady=false; detectorReady=false; detectorError=false;
    if(controller) {try{controller.dispose();}catch(_){} controller=null;}
    if(cameraParam) {try{cameraParam.dispose();}catch(_){} cameraParam=null;}
    projection=null; markerPose=null;
    currentIds=[]; currentMarkers=[]; processedFrames=0; lastDetectionAt=0; lastUIAt=0;
    diagnostics.classList.remove('error','good');
    resultEl.textContent='Zaganjam kamero …';
    detectorState.textContent='Detektor: čakam';
    cameraState.textContent='Kamera: čakam';
    idState.textContent='Videni ID-ji: —';
    hint.textContent='Za test uporabi ARToolKit barcode 3×3, ID 5.';
    centerMessage.hidden=false;
    centerMessage.textContent='Zaganjam kamero …';
    try {
      if(!navigator.mediaDevices?.getUserMedia) throw new Error('Kamera je dovoljena samo na HTTPS ali localhost.');
      // NESPReMENJENO IZ TVOJE DELOUJOČE OSNOVE:
      stream=await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}
      });
      if(myRun!==runId) return;
      video.srcObject=stream;
      await video.play();
      if(!video.videoWidth||!video.videoHeight) throw new Error('Brskalnik ni poslal slike iz kamere.');
      cameraReady=true;
      cameraState.textContent=`Kamera: deluje (${video.videoWidth} × ${video.videoHeight})`;
      centerMessage.textContent='Nalaganje detektorja …';
      const factor=Math.min(1,640/Math.max(video.videoWidth,video.videoHeight));
      detectCanvas.width=Math.max(1,Math.round(video.videoWidth*factor));
      detectCanvas.height=Math.max(1,Math.round(video.videoHeight*factor));
      frameId=requestAnimationFrame(render);
      await loadARToolkit();
      if(myRun!==runId) return;
      detectorState.textContent='Detektor: nalagam kalibracijo …';
      const param=await loadCameraParameters();
      if(myRun!==runId) return;
      await createDetector(param);
      if(myRun!==runId) return;
      detectorState.textContent='Detektor: pripravljen (barcode 3×3)';
      centerMessage.hidden=true;
    } catch(err) {
      if(myRun!==runId) return;
      if(!cameraReady) cameraState.textContent='Kamera: ne deluje';
      showError(err.message||String(err));
    }
  }

  restartButton.addEventListener('click',restart);
  window.addEventListener('pagehide',()=>{
    runId++;
    cancelAnimationFrame(frameId);
    resizeObserver.disconnect();
    if(stream) stream.getTracks().forEach(track=>track.stop());
    if(controller) controller.dispose();
    if(cameraParam) cameraParam.dispose();
  });
  restart();
})();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="sl">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Coil AR v22 - XYZ in odmik Z</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

    #status {
      position: fixed;
      top: 12px;
      left: 10px;
      right: 10px;

      z-index: 1000;

      padding: 10px;

      text-align: center;
      color: white;
      font-size: 14px;
      font-weight: bold;

      background: rgba(0, 0, 0, 0.7);
      border-radius: 9px;

      pointer-events: none;
    }
  </style>

</head>

<body>

  <div id="status">
    Coil AR v22 — iščem marker ID 5 ...
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true;antialias:true"
    arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono_and_matrix;matrixCodeType:3x3;"
  >

    <!-- MARKER ID 5 -->
    <a-marker
      id="marker5"
      type="barcode"
      value="5"
      emitevents="true"
    >

      <!--
        FIZIČNO MERILO

        Marker ID 5:
        širina = 3,5 cm

        1 scenska enota ≈ 3,5 cm

        Želeni odmik Z:
        -8 cm / 3,5 cm = -2,285714

        Izhodišče novega koordinatnega
        sistema leži 8 cm v smeri -Z
        od središča markerja.
      -->

      <a-entity
        id="xyz-origin"
        position="0 0 -2.285714"
      >

        <!-- BELO IZHODIŠČE -->
        <a-sphere
          position="0 0 0"
          radius="0.065"
          color="#ffffff"
          material="shader:flat"
        >
        </a-sphere>


        <!-- ===================== -->
        <!-- OS X - RDEČA          -->
        <!-- Dolžina osi: 5 cm     -->
        <!-- ===================== -->

        <a-cylinder
          position="0.65 0 0"
          rotation="0 0 -90"
          radius="0.018"
          height="1.30"
          color="#ff3030"
          material="shader:flat"
        >
        </a-cylinder>

        <a-cone
          position="1.38 0 0"
          rotation="0 0 -90"
          radius-bottom="0.085"
          radius-top="0"
          height="0.25"
          color="#ff3030"
          material="shader:flat"
        >
        </a-cone>


        <!-- ===================== -->
        <!-- OS Y - ZELENA         -->
        <!-- Dolžina osi: 5 cm     -->
        <!-- ===================== -->

        <a-cylinder
          position="0 0.65 0"
          radius="0.018"
          height="1.30"
          color="#22ff55"
          material="shader:flat"
        >
        </a-cylinder>

        <a-cone
          position="0 1.38 0"
          radius-bottom="0.085"
          radius-top="0"
          height="0.25"
          color="#22ff55"
          material="shader:flat"
        >
        </a-cone>


        <!-- ===================== -->
        <!-- OS Z - MODRA          -->
        <!-- Dolžina osi: 5 cm     -->
        <!-- ===================== -->

        <a-cylinder
          position="0 0 0.65"
          rotation="90 0 0"
          radius="0.018"
          height="1.30"
          color="#2288ff"
          material="shader:flat"
        >
        </a-cylinder>

        <a-cone
          position="0 0 1.38"
          rotation="90 0 0"
          radius-bottom="0.085"
          radius-top="0"
          height="0.25"
          color="#2288ff"
          material="shader:flat"
        >
        </a-cone>

      </a-entity>

    </a-marker>

    <!-- KAMERA -->
    <a-entity camera></a-entity>

  </a-scene>


  <script>
    const marker = document.getElementById(
      "marker5"
    );

    const status = document.getElementById(
      "status"
    );

    marker.addEventListener(
      "markerFound",
      () => {
        status.textContent =
          "✓ ID 5 zaznan | XYZ: Z = -8 cm";
      }
    );

    marker.addEventListener(
      "markerLost",
      () => {
        status.textContent =
          "Iščem marker ID 5 ...";
      }
    );
  </script>

</body>
</html>

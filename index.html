<!doctype html>
<html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Coil AR — Geometry v4 (brez OpenCV)</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0e14;color:white;font-family:system-ui,Arial,sans-serif}video,canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#camera{z-index:1;object-fit:cover;background:#111}#overlay{z-index:2;touch-action:none}.top,.bottom{position:fixed;left:10px;right:10px;z-index:5;pointer-events:none}.top{top:calc(10px + env(safe-area-inset-top))}.bottom{bottom:calc(12px + env(safe-area-inset-bottom))}.panel{background:rgba(4,10,20,.87);border:1px solid #ffffff35;border-radius:14px;padding:10px 12px;backdrop-filter:blur(5px)}#status{font-size:17px;font-weight:700}#detail{font-size:13px;color:#c9d9e9;margin-top:4px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;pointer-events:auto}button{border:none;border-radius:9px;padding:10px 13px;min-height:42px;background:#d1e8ff;color:#09263d;font:700 14px system-ui}button:disabled{opacity:.45}.secondary{background:#2b3a50;color:#fff}.bottom{font-size:12px}#stats{margin-top:5px;color:#a9c5dc}#guide{display:none;margin-top:8px;font-size:13px;color:#f5dfa0}
</style></head><body>
<video id="camera" autoplay muted playsinline webkit-playsinline></video><canvas id="overlay"></canvas><canvas id="proc" hidden></canvas>
<div class="top"><div class="panel"><div id="status">Geometry v4 — pripravljeno ✓</div><div id="detail">Brez OpenCV/WASM. Najprej zaženi kamero.</div><div class="buttons"><button id="start">Zaženi kamero</button><button id="cal" class="secondary" disabled>Označi 4 točke</button><button id="reset" class="secondary" disabled>Ponastavi</button></div><div id="guide">Tapni točke na LESENEM KOSU v vrstnem redu: 1. spodnji levi kot, 2. spodnja črta na loku, 3. srednja črta na loku, 4. zgornja črta na loku.</div></div></div>
<div class="bottom"><div class="panel"><div id="instruction">Po zagonu kamere pritisni »Označi 4 točke«.</div><div id="stats">Kamera: izklopljena · Sledenje: izklopljeno</div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),video=$('camera'),canvas=$('overlay'),ctx=canvas.getContext('2d'),proc=$('proc'),pc=proc.getContext('2d',{willReadFrequently:true});
const status=$('status'),detail=$('detail'),instruction=$('instruction'),stats=$('stats'),startButton=$('start'),calButton=$('cal'),resetButton=$('reset');
let stream=null, running=false, choosing=false, tracking=false, markers=[], templates=[], prev=null, lastFrame=0, goodCount=0, frame=0;
let W=320,H=568, currentH=null, initialPts=null, origModel=null, lost=0, viewW=360,viewH=640;
const pointLabels=['spodnji levi kot','spodnji stik črte z lokom','srednji stik črte z lokom','zgornji stik črte z lokom'];
function report(s,d=''){status.textContent=s;detail.textContent=d}
function resize(){const r=canvas.getBoundingClientRect();viewW=r.width;viewH=r.height;canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);ctx.setTransform(canvas.width/r.width,0,0,canvas.height/r.height,0,0);const k=Math.min(1,320/r.width);W=Math.round(r.width*k);H=Math.round(r.height*k);proc.width=W;proc.height=H;if(tracking||choosing)reset('Zaslon se je obrnil — ponovno označi točke.');}
function coords(e){let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function place(p){return [p[0]*viewW/W,p[1]*viewH/H]}
function line(a,b,color,width=3){if(!a||!b)return;const A=place(a),B=place(b);ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function dot(p,color,label){let [x,y]=place(p);ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#07141e';ctx.lineWidth=2;ctx.stroke();ctx.font='bold 16px system-ui';ctx.lineWidth=4;ctx.strokeText(label,x+10,y-10);ctx.fillStyle='#fff';ctx.fillText(label,x+10,y-10)}
function sampleVideo(){if(video.readyState<2||!video.videoWidth)return false;let w=video.videoWidth,h=video.videoHeight,s=Math.max(W/w,H/h);let sw=W/s,sh=H/s;pc.drawImage(video,(w-sw)/2,(h-sh)/2,sw,sh,0,0,W,H);return true}
function grayFrame(){const d=pc.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;return g}
function patch(gray,p,r=7){let x=Math.round(p[0]),y=Math.round(p[1]);if(x<r+2||y<r+2||x>=W-r-2||y>=H-r-2)return null;let a=new Uint8Array((2*r+1)**2),k=0;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)a[k++]=gray[(y+dy)*W+x+dx];return a}
function match(gray,p,tmpl){let x=Math.round(p[0]),y=Math.round(p[1]),r=7,search=13,best=1e20,bx=x,by=y,valid=false;for(let dy=-search;dy<=search;dy+=2){let yy=y+dy;if(yy-r<0||yy+r>=H)continue;for(let dx=-search;dx<=search;dx+=2){let xx=x+dx;if(xx-r<0||xx+r>=W)continue;let k=0,sum=0;for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){let v=gray[(yy+j)*W+xx+i]-tmpl[k++];sum+=Math.abs(v)}if(sum<best){best=sum;bx=xx;by=yy;valid=true}}} // podpiksel ni potreben za prvi preizkus
return valid?{p:[bx,by],score:best/tmpl.length}:null}
function solve(a,b){const n=b.length;for(let i=0;i<n;i++){let q=i;for(let j=i+1;j<n;j++)if(Math.abs(a[j][i])>Math.abs(a[q][i]))q=j;if(Math.abs(a[q][i])<1e-8)return null;[a[i],a[q]]=[a[q],a[i]];[b[i],b[q]]=[b[q],b[i]];let inv=1/a[i][i];for(let k=i;k<n;k++)a[i][k]*=inv;b[i]*=inv;for(let j=0;j<n;j++)if(j!==i){let c=a[j][i];for(let k=i;k<n;k++)a[j][k]-=c*a[i][k];b[j]-=c*b[i]}}return b}
function homography(src,dst){let A=[],b=[];for(let i=0;i<4;i++){let [x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}const z=solve(A,b);return z?[...z,1]:null}
function project(M,p){let [x,y]=p,d=M[6]*x+M[7]*y+M[8];return Math.abs(d)>1e-8?[(M[0]*x+M[1]*y+M[2])/d,(M[3]*x+M[4]*y+M[5])/d]:null}
const R=150,angles=[21,51,76].map(x=>x*Math.PI/180),model=[[0,0],...angles.map(a=>[R*(1-Math.cos(a)),-R*Math.sin(a)])];
function drawAxes(M){if(!M)return;let curve=[];for(let deg=0;deg<=90;deg+=4){let a=deg*Math.PI/180;curve.push(project(M,[R*(1-Math.cos(a)),-R*Math.sin(a)]))}curve.push(project(M,[R,0]));curve.push(project(M,[0,0]));for(let i=1;i<curve.length;i++)line(curve[i-1],curve[i],'#42f5d1',2);
const origin=project(M,[R,0]),x=project(M,[R-45,0]),y=project(M,[R,-45]);line(origin,x,'#ff5353',5);line(origin,y,'#4cff7a',5);if(origin&&x)dot(x,'#ff5353','X');if(origin&&y)dot(y,'#4cff7a','Y');
// Modra smer je samo grafični približek normale, ne izmerjena 6DoF orientacija.
if(origin&&x&&y){let vx=[x[0]-origin[0],x[1]-origin[1]],vy=[y[0]-origin[0],y[1]-origin[1]],z=[origin[0]+.55*(vx[1]-vy[1]),origin[1]-.55*(vx[0]-vy[0])];line(origin,z,'#54a6ff',4);dot(z,'#54a6ff','Z*')}
if(origin)dot(origin,'#fff','0')}
function reset(message){choosing=false;tracking=false;markers=[];templates=[];currentH=null;initialPts=null;origModel=null;lost=0;calButton.disabled=!running;resetButton.disabled=!running;$('guide').style.display='none';if(message)report(message);instruction.textContent='Pritisni »Označi 4 točke« in označi štiri točke na lesu.'}
function startCalibration(){if(!running)return;reset();choosing=true;$('guide').style.display='block';calButton.disabled=true;report('Označi točko 1/4',pointLabels[0]);instruction.textContent='Dotakni se spodnjega levega kota lesa (točka 1).'}
function finishCalibration(){if(!sampleVideo())return;const gray=grayFrame();templates=markers.map(p=>patch(gray,p));if(templates.some(p=>!p)){reset('Točka je preblizu roba zaslona. Ponovi označevanje.');return}initialPts=markers.map(p=>p.slice());currentH=homography(model,markers);if(!currentH){reset('Kalibracija ni uspela — ponovno označi točke.');return}choosing=false;tracking=true;lost=0;$('guide').style.display='none';calButton.disabled=false;report('Poskusno sledenje vključeno ✓','Počasi premikaj telefon. To je prvi eksperimentalni sledilnik.');instruction.textContent='Turkizen obris in osi naj sledijo lesu. Z* je približek, ne izračunana 3D orientacija.'}
function track(gray){let points=[],scores=[];for(let i=0;i<4;i++){let m=match(gray,markers[i],templates[i]);if(!m||m.score>40){lost++;if(lost>=4)reset('Sledenje izgubljeno — označi točke znova.');return}points.push(m.p);scores.push(m.score)}const M=homography(model,points);if(!M){lost++;return}const maxJump=Math.max(...points.map((p,i)=>Math.hypot(p[0]-markers[i][0],p[1]-markers[i][1])));if(maxJump>22){lost++;return}lost=0;markers=points;templates=markers.map(p=>patch(gray,p));currentH=M;goodCount++;if(goodCount%8===0)report('SLEDENJE (test) ✓',`4 točke · povprečna razlika ${Math.round(scores.reduce((a,b)=>a+b,0)/4)} · majhni premiki`)}
function paint(){ctx.clearRect(0,0,viewW,viewH);if(choosing)markers.forEach((p,i)=>dot(p,'#ffe052',String(i+1)));if(tracking&&currentH){drawAxes(currentH);markers.forEach((p,i)=>dot(p,'#ffe052',String(i+1)))}}
function tick(t){if(!running)return;requestAnimationFrame(tick);if(t-lastFrame<85)return;lastFrame=t;if(!sampleVideo())return;frame++;if(tracking){const g=grayFrame();track(g)}paint();if(frame%12===0)stats.textContent=`Video ${video.videoWidth}×${video.videoHeight} · sledenje ${tracking?'DA':choosing?'označevanje':'NE'} · brez OpenCV / WASM`}
async function startCamera(){if(running)return;startButton.disabled=true;report('Odpiram kamero…');try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();running=true;resize();calButton.disabled=false;resetButton.disabled=false;startButton.textContent='Ustavi kamero';report('Geometry v4 · kamera deluje ✓','Izberi »Označi 4 točke«');requestAnimationFrame(tick)}catch(err){report('Napaka kamere: '+err.name,err.message||'');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}finally{startButton.disabled=false}}
function stopCamera(){running=false;reset();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.pause();video.srcObject=null;startButton.textContent='Zaženi kamero';calButton.disabled=true;resetButton.disabled=true;report('Kamera ustavljena');stats.textContent='Kamera: izklopljena'}
startButton.addEventListener('click',()=>running?stopCamera():startCamera());calButton.addEventListener('click',startCalibration);resetButton.addEventListener('click',()=>reset('Ponastavljeno.'));
canvas.addEventListener('pointerdown',e=>{if(!choosing)return;e.preventDefault();markers.push(coords(e));const n=markers.length;if(n===4){finishCalibration();return}report(`Označi točko ${n+1}/4`,pointLabels[n]);instruction.textContent=`Dotakni se: ${pointLabels[n]}.`});
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)stopCamera()});resize();
</script></body></html>


<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Coil AR v20 — osnovni test AR.js</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="alpha:true;antialias:true"
    arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono_and_matrix;matrixCodeType:3x3;">

    <!-- MARKER ID 5 -->
    <a-marker
      type="barcode"
      value="5"
      emitevents="true">

      <!-- Cian kvadrat v ravnini markerja -->
      <a-plane
        position="0 0.01 0"
        rotation="-90 0 0"
        width="0.8"
        height="0.8"
        color="#00ffff"
        material="opacity:0.4;transparent:true;side:double">
      </a-plane>

      <!-- Oranžna kocka -->
      <a-box
        position="0 0.30 0"
        width="0.4"
        height="0.6"
        depth="0.4"
        color="#ff8c00">
      </a-box>

    </a-marker>

    <!-- MARKER ID 6 -->
    <a-marker
      type="barcode"
      value="6"
      emitevents="true">

      <!-- Rumen kvadrat v ravnini markerja -->
      <a-plane
        position="0 0.01 0"
        rotation="-90 0 0"
        width="0.8"
        height="0.8"
        color="#ffff00"
        material="opacity:0.4;transparent:true;side:double">
      </a-plane>

      <!-- Modra kocka -->
      <a-box
        position="0 0.30 0"
        width="0.4"
        height="0.6"
        depth="0.4"
        color="#1688ff">
      </a-box>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>

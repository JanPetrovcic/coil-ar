<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coil AR — Marker v5</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
    background: #111;
  }
  body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    overflow: hidden !important;
    background: transparent !important;
    font-family: Arial, sans-serif;
  }
  /* AR.js video: ohranimo celozaslonski prikaz iz delujoče v4.
     Pomembno: object-fit:cover lahko odreže robove slike. */
  video, video.arjs-video, body > video {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    max-width: none !important;
    max-height: none !important;
    object-fit: cover !important;
    transform: none !important;
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
    z-index: 0 !important;
    margin: 0 !important;
  }
  a-scene {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    background: transparent !important;
    z-index: 1 !important;
  }
  a-scene canvas { background: transparent !important; }
  .a-enter-vr, .a-enter-ar { display: none !important; }

  /* HUD mora biti omejen na VIDNI zaslon, tudi na ozkih telefonih. */
  #hud, #tip {
    position: fixed !important;
    left: max(10px, env(safe-area-inset-left)) !important;
    right: max(10px, env(safe-area-inset-right)) !important;
    width: auto !important;
    max-width: calc(100vw - 20px) !important;
    z-index: 9999 !important;
    color: white;
    pointer-events: none;
    text-align: center;
    overflow-wrap: anywhere;
    word-break: normal;
    white-space: normal;
    min-width: 0;
  }
  #hud { top: calc(8px + env(safe-area-inset-top)); }
  #status, #diag, #tip {
    border-radius: 10px;
    background: rgba(0, 0, 0, .76);
    padding: 7px 9px;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  #status { font-size: 14px; font-weight: bold; line-height: 1.3; }
  #diag { font-size: 11px; color: #c7efff; line-height: 1.4; margin-top: 5px; }
  #tip {
    bottom: calc(8px + env(safe-area-inset-bottom));
    font-size: 11px;
    line-height: 1.35;
  }
  @media (max-width: 360px) {
    #status { font-size: 13px; }
    #diag, #tip { font-size: 10px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div id="status">Marker v5 — zaganjam kamero …</div>
  <div id="diag">Čakam na video …</div>
</div>
<div id="tip">Barcode 3×3 · ID 5 · 35 mm | Rdeča X · Zelena Y (iz markerja) · Modra Z</div>

<!--
  NASTAVITVE KAMERE / SLEDENJA (začetni preizkus višje ločljivosti):
  sourceWidth / sourceHeight = ZAHTEVANA ločljivost kamere (ne zagotovljena)
  canvasWidth / canvasHeight = ločljivost OBDELAVE za marker
  maxDetectionRate = največ poskusov prepoznavanja na sekundo
  Če kamera ne dela, uporabi priloženi index-standard.html.
-->
<a-scene embedded vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
         renderer="alpha:true;antialias:true"
         arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono_and_matrix;matrixCodeType:3x3;sourceWidth:1280;sourceHeight:960;displayWidth:1280;displayHeight:960;canvasWidth:960;canvasHeight:720;maxDetectionRate:30;">
  <a-marker id="target" type="barcode" value="5" size="0.035" emitevents="true"
            smooth="true" smooth-count="5" smooth-tolerance="0.01" smooth-threshold="2">
    <!-- 
      coil-origin: SAMO PREMIK izhodišča (metri).
      axis-visualization: SAMO VELIKOST osi.
      Tako AXIS_SCALE NE povečuje OFFSET_X/Y/Z.
    -->
    <a-entity id="coil-origin">
      <a-entity id="axis-visualization">
        <!-- Izhodišče -->
        <a-sphere radius="0.008" color="#ffffff" material="shader:flat;side:double"></a-sphere>
        <a-torus radius="0.014" radius-tubular="0.0018" rotation="90 0 0" color="#ffffff" material="shader:flat"></a-torus>

        <!-- X: rdeča -->
        <a-cylinder position="0.05 0 0" radius="0.0027" height="0.10" rotation="0 0 -90" color="#ff3030" material="shader:flat"></a-cylinder>
        <a-cone position="0.107 0 0" radius-bottom="0.008" radius-top="0" height="0.015" rotation="0 0 -90" color="#ff3030" material="shader:flat"></a-cone>
        <a-text value="X" position="0.124 0.009 0" color="#ff3030" align="center" width="0.09" side="double"></a-text>

        <!-- Y: zelena, pravokotno na marker -->
        <a-cylinder position="0 0.05 0" radius="0.0027" height="0.10" color="#2bff60" material="shader:flat"></a-cylinder>
        <a-cone position="0 0.107 0" radius-bottom="0.008" radius-top="0" height="0.015" color="#2bff60" material="shader:flat"></a-cone>
        <a-text value="Y" position="0.012 0.129 0" color="#2bff60" align="center" width="0.09" side="double"></a-text>

        <!-- Z: modra, v ravnini markerja -->
        <a-cylinder position="0 0 0.05" radius="0.0027" height="0.10" rotation="90 0 0" color="#2b9cff" material="shader:flat"></a-cylinder>
        <a-cone position="0 0 0.107" radius-bottom="0.008" radius-top="0" height="0.015" rotation="90 0 0" color="#2b9cff" material="shader:flat"></a-cone>
        <a-text value="Z" position="0.012 0.006 0.132" color="#2b9cff" align="center" rotation="-90 0 0" width="0.09" side="double"></a-text>
      </a-entity>
    </a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<script>
/* ========================================================================
   NASTAVITVE — SPREMINJAJ SAMO TE VRSTICE

   OFFSET_*: položaj novega izhodišča glede na središče markerja, v METRIH.
   AXIS_SCALE: enotna povečava osi, puščic, napisov in krogle.

   Os Y je pravokotna iz ravnine markerja, X in Z sta v njegovi ravnini.
   0.01 pomeni 1 cm. Marker je na zadnji strani tuljave.
   ======================================================================== */
const OFFSET_X = 0.00;
const OFFSET_Y = 0.00;
const OFFSET_Z = 0.00;
const AXIS_SCALE = 3;        // 1 = izvirno, 3 = 3×, 10 = 10×
/* ======================================================================== */

(function () {
  'use strict';
  const scene = document.querySelector('a-scene');
  const marker = document.getElementById('target');
  const origin = document.getElementById('coil-origin');
  const axes = document.getElementById('axis-visualization');
  const status = document.getElementById('status');
  const diag = document.getElementById('diag');

  // Pomembno: povečujemo notranjo vizualizacijo, ne markerja ali offseta.
  origin.setAttribute('position', `${OFFSET_X} ${OFFSET_Y} ${OFFSET_Z}`);
  axes.setAttribute('scale', `${AXIS_SCALE} ${AXIS_SCALE} ${AXIS_SCALE}`);

  let found = false;
  let loaded = false;
  marker.addEventListener('markerFound', () => {
    found = true;
    status.textContent = '✓ Marker ID 5 zaznan — XYZ';
  });
  marker.addEventListener('markerLost', () => {
    found = false;
    status.textContent = 'Marker izgubljen — pokaži ID 5';
  });
  scene.addEventListener('loaded', () => {
    loaded = true;
    if (!found) status.textContent = 'Marker v5 — usmeri telefon na ID 5';
  });
  window.addEventListener('error', event => {
    status.textContent = 'Napaka: ' + (event.message || 'neznana');
  });
  window.addEventListener('unhandledrejection', event => {
    status.textContent = 'Napaka: ' + String(event.reason || 'neznana');
  });

  function layoutAndDiagnostics() {
    const video = [...document.querySelectorAll('video')].find(v => v.srcObject) || document.querySelector('video');
    const canvas = scene.querySelector('canvas');
    if (video) {
      video.setAttribute('playsinline', '');
      video.muted = true;
      // Enako kot v delujočem v4: samo popravimo prikaz, ne zaganjamo nove kamere.
      for (const [key, value] of Object.entries({
        position: 'fixed', top: '0', left: '0',
        width: '100vw', height: '100dvh',
        objectFit: 'cover', transform: 'none', zIndex: '0'
      })) {
        video.style.setProperty(key.replace(/[A-Z]/g, ch => '-' + ch.toLowerCase()), value, 'important');
      }
    }
    if (scene.renderer) {
      scene.renderer.setClearColor(0x000000, 0);
      scene.renderer.setClearAlpha(0);
    }
    if (canvas) canvas.style.setProperty('background', 'transparent', 'important');

    if (!video) {
      diag.textContent = 'Kamera: čakam · Scena: ' + (loaded ? 'OK' : 'nalaga');
      return;
    }
    const track = video.srcObject?.getVideoTracks?.()[0];
    const settings = track?.getSettings?.() || {};
    const requested = 'zahtevano 1280×960';
    const actual = `${video.videoWidth || 0}×${video.videoHeight || 0}`;
    const streamInfo = settings.width && settings.height
      ? ` · tok ${settings.width}×${settings.height}` : '';
    diag.textContent = `Video ${actual}${streamInfo} · ${video.paused ? 'premor' : 'predvaja'} · ID 5 ${found ? 'DA' : 'NE'} · ${requested} · skala ${AXIS_SCALE}×`;
  }
  window.addEventListener('resize', layoutAndDiagnostics);
  setInterval(layoutAndDiagnostics, 850);
  layoutAndDiagnostics();
})();
</script>
</body>
</html>
